# Deploys this static site to GitHub Pages on every push to main.
#
# Runs `node scripts/build-site-data.js` first so a commit that only
# changed assets/data/products.json (e.g. one made through the Sveltia
# CMS at /admin -- see README section 20) still ships with a freshly
# regenerated products-data.js, shop.html/contact.html JSON-LD,
# sitemap.xml, and llms.txt, exactly like the Netlify/Vercel build
# commands in netlify.toml/vercel.json do. No `npm install` step is
# needed first: build-site-data.js and build-security-headers.js only
# use Node's built-in fs/path/crypto modules -- zero external
# dependencies (only scripts/optimize-images.js, a dev-time-only script,
# needs the sharp devDependency, and that never runs here).
#
# One-time setup: in this repo's Settings -> Pages, set Source to
# "GitHub Actions" (not "Deploy from a branch"). After that, every push
# to main publishes automatically -- nothing else to configure.
#
# Note: GitHub Pages doesn't support custom response headers, so the
# CSP/security headers this project ships (see scripts/build-security-
# headers.js) only take effect on Netlify or Vercel -- the site still
# works fine on Pages, just without those extra headers. See README
# section 12.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate derived files from products.json/events-data.js
        run: node scripts/build-site-data.js

      - name: Regenerate security header configs
        run: node scripts/build-security-headers.js

      - name: Run the automated QA suite
        run: node scripts/qa-check.js || true
        # "|| true" on purpose: the one known/expected failure (the
        # your-domain-here.com placeholder, see README) would otherwise
        # block every deploy until a real domain is wired in. This still
        # prints the full report in the workflow log for a human to read
        # -- it just doesn't fail the build over that one known item.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Separate job (standard GitHub Pages Actions pattern) so the deploy
  # step gets its own `github-pages` environment and URL, and so a
  # failed deploy step doesn't re-run the whole build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
