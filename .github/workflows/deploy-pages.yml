# Deploys this static site to GitHub Pages on every push to main.
#
# Runs `node scripts/build-site-data.js` first so a commit that only
# changed assets/data/products.json (e.g. one made through the Sveltia
# CMS at /admin -- see DEVELOPMENT.md section 20) still ships with a freshly
# regenerated products-data.js, shop.html/contact.html JSON-LD,
# sitemap.xml, and llms.txt, exactly like the Netlify/Vercel build
# commands in netlify.toml/vercel.json do.
#
# Dependencies DO have to be installed here, despite the build scripts
# themselves using only Node built-ins: the QA suite runs the unit test
# suites, and scripts/backend-functions.test.js loads
# netlify/functions/fulfill-gift-card.js, which requires `resend`. Without
# an install that suite dies with MODULE_NOT_FOUND. It always did -- the
# QA step used to swallow its own exit code, so the failure printed into
# the log and the deploy went out anyway. PUPPETEER_SKIP_DOWNLOAD keeps
# the install cheap by skipping the ~150MB Chromium this job never uses.
#
# One-time setup: in this repo's Settings -> Pages, set Source to
# "GitHub Actions" (not "Deploy from a branch"). After that, every push
# to main publishes automatically -- nothing else to configure.
#
# Note: GitHub Pages doesn't support custom response headers, so the
# CSP/security headers this project ships (see scripts/build-security-
# headers.js) only take effect on Netlify or Vercel -- the site still
# works fine on Pages, just without those extra headers. See DEVELOPMENT.md
# section 12.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm ci --no-audit --no-fund

      - name: Regenerate derived files from products.json/events-data.js
        run: node scripts/build-site-data.js

      - name: Regenerate security header configs
        run: node scripts/build-security-headers.js

      - name: Run the automated QA suite
        run: npm test
        # This gate blocks the deploy on purpose. It used to end in
        # "|| true" back when the site had no real domain yet and the
        # "Live-domain placeholder" check was expected to fail on every
        # run. The real domain is wired in now and the suite passes
        # clean, so swallowing the exit code would only mean shipping a
        # broken build (dead link, malformed price, CSP drift) straight
        # to the live site with the failure buried in a log nobody reads.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Separate job (standard GitHub Pages Actions pattern) so the deploy
  # step gets its own `github-pages` environment and URL, and so a
  # failed deploy step doesn't re-run the whole build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
