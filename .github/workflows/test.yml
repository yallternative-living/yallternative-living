name: QA checks

# Runs ESLint, Prettier's format check, and the site's own automated QA
# suite (scripts/qa-check.js, "npm test") on every push and pull request --
# catches a broken build, a dead link, a malformed variant/rating, CSP
# drift between _headers/vercel.json/netlify.toml, or a lint/format issue
# before it ever reaches a real deploy, instead of relying on someone
# remembering to run these by hand first.
#
# Every step here is expected to pass. A red run means a real regression
# to fix, not a known-pending item to wave through. (This note used to say
# the opposite -- the "Live-domain placeholder" check was expected to fail
# until a real domain was set. That domain is set, so the exception is
# gone.)

# Minutes-saving notes (added to stop this workflow burning Actions minutes):
#   * paths-ignore: doc-only commits (*.md, docs/) don't trigger a run.
#   * concurrency: a newer push cancels the older in-progress run instead of
#     letting both finish.
#   * PUPPETEER_SKIP_DOWNLOAD on the `qa` job: that job runs lint/format/qa
#     only -- none of which need a browser -- so it skips Puppeteer's ~150MB
#     Chromium download. The separate `browser` job below does need browsers
#     and therefore does not set it.
#   * npm cache: setup-node caches ~/.npm keyed on the lockfile so repeat
#     installs are near-instant.
# The biggest lever of all, though, is repo visibility: GitHub Actions is
# FREE and UNLIMITED on public repos. This is a static marketing site with no
# real secrets committed (keys are placeholders / GitHub Secrets), so making
# the repo public removes the minutes cap entirely.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    # Normally ~30s. A cap costs nothing when green and stops a hung run from
    # burning the 360-minute default on a workflow built to save minutes.
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # The browser gates. These were local-only until now, which meant the
  # accessibility gate, the scroll-reveal gate and the Puppeteer suites could
  # all regress and still show a green board -- exactly how a blank about.html
  # reached production once already. They cost minutes (a Puppeteer Chromium
  # download plus three Playwright engines), so they run as their own job:
  # `qa` above stays fast and fails first on the cheap stuff, and the engines
  # are cached between runs keyed on the lockfile.
  browser:
    runs-on: ubuntu-latest
    # ~6 minutes cold (engine downloads), less on a cache hit. Browser jobs are
    # the ones that hang -- a wedged page load has no deadline of its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # No PUPPETEER_SKIP_DOWNLOAD here: test:integration needs that Chromium.
      - run: npm install --no-audit --no-fund
      - name: Cache Playwright engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Left unconditional even on a cache hit: the download is skipped but the
      # system libraries WebKit needs are not part of the cache.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:integration
      - run: npm run test:cross-browser
