name: QA checks

# Runs the site's own automated QA suite (scripts/qa-check.js, "npm test")
# on every push and pull request -- catches a broken build, a dead link,
# a malformed variant/rating, or CSP drift between _headers/vercel.json/
# netlify.toml before it ever reaches a real deploy, instead of relying on
# someone remembering to run `npm test` by hand first.
#
# Note: as of the domain still being the "your-domain-here.com" placeholder
# (see scripts/build-site-data.js), this workflow is EXPECTED to fail on
# the "Live-domain placeholder" check until a real production domain is
# set and `npm run build-data` is re-run -- that's the check doing its job,
# not a broken pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm test
