name: QA checks

# Runs ESLint, Prettier's format check, and the site's own automated QA
# suite (scripts/smoke-test.js, scripts/qa-check.js, "npm test") on every push and pull request --
# catches a broken build, a dead link, a malformed variant/rating, CSP
# drift between _headers/vercel.json/netlify.toml, or a lint/format issue
# before it ever reaches a real deploy, instead of relying on someone
# remembering to run these by hand first.
#
# Every step here is expected to pass. A red run means a real regression
# to fix, not a known-pending item to wave through. (This note used to say
# the opposite -- the "Live-domain placeholder" check was expected to fail
# until a real domain was set. That domain is set, so the exception is
# gone.)

# Action versions (checked Aug 2026): checkout v7, setup-node v7, cache v6 are
# the current majors. v4 of each ran on the Node20 action runtime, which GitHub
# stopped defaulting to on 2026-06-16 and removes entirely on 2026-09-23 --
# after that a v4 action does not run at all, opt-out flag or no. Everything
# from v5 onward runs on Node24 and needs runner >= 2.327.1, which
# GitHub-hosted ubuntu-latest satisfies.
#
# `node-version` below is a different thing: the Node the project's own tests
# run on, not the actions runtime. It is 24 because that is Active LTS -- Node
# 20 went end-of-life on 2026-03-24 (so CI was testing on an unpatched runtime)
# and 22 is only in maintenance. Every suite in this repo is verified green on
# 24.20.0.
#
# Minutes-saving notes (added to stop this workflow burning Actions minutes):
#   * paths-ignore: doc-only commits (*.md, docs/) don't trigger a run.
#   * concurrency: a newer push cancels the older in-progress run instead of
#     letting both finish.
#   * path filtering (changes job): separates routine content/data edits from
#     core frontend/worker/script changes using dorny/paths-filter.
#   * fast smoke test (test:smoke): executes in <3s (<0.5s typical) on every run.
#   * conditional browser job: heavy multi-engine Playwright browser downloads
#     and tests are reserved for core file changes or pushes to main.
#   * PUPPETEER_SKIP_DOWNLOAD on the `qa` job: that job runs lint/format/smoke/qa
#     only -- none of which need a browser -- so it skips Puppeteer's ~150MB
#     Chromium download. The separate `browser` job below does need browsers
#     and therefore does not set it.
#   * npm cache: setup-node caches ~/.npm keyed on the lockfile so repeat
#     installs are near-instant.
# The biggest lever of all, though, is repo visibility: GitHub Actions is
# FREE and UNLIMITED on public repos. This is a static marketing site with no
# real secrets committed (keys are placeholders / GitHub Secrets), so making
# the repo public removes the minutes cap entirely.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Evaluate changed files to determine downstream execution paths
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'assets/js/**'
              - 'assets/css/**'
              - 'workers/**'
              - 'netlify/**'
              - 'scripts/**'
              - '*.html'
              - 'products/*.html'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

  # Job 2: Fast Quality & Smoke Gate (Runs on ALL PRs and pushes)
  qa:
    runs-on: ubuntu-latest
    # Normally ~30s. A cap costs nothing when green and stops a hung run from
    # burning the 360-minute default on a workflow built to save minutes.
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - name: Fast Smoke Gate (<3s)
        run: npm run test:smoke
      - name: Full Unit & QA Suite
        run: npm test

  # The browser gates. These were local-only until now, which meant the
  # accessibility gate, the scroll-reveal gate and the Puppeteer suites could
  # all regress and still show a green board -- exactly how a blank about.html
  # reached production once already. They cost minutes (a Puppeteer Chromium
  # download plus three Playwright engines), so they run as their own job:
  # `qa` above stays fast and fails first on the cheap stuff, and the engines
  # are cached between runs keyed on the lockfile.
  browser:
    needs: [changes, qa]
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    # ~6 minutes cold (engine downloads), less on a cache hit. Browser jobs are
    # the ones that hang -- a wedged page load has no deadline of its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      # No PUPPETEER_SKIP_DOWNLOAD here: test:integration needs that Chromium.
      - run: npm install --no-audit --no-fund
      - name: Cache Playwright engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Left unconditional even on a cache hit: the download is skipped but the
      # system libraries WebKit needs are not part of the cache.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:integration
      - run: npm run test:cross-browser
