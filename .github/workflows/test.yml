name: QA checks

# Runs ESLint, Prettier's format check, and the site's own automated QA
# suite (scripts/qa-check.js, "pnpm test") on every push and pull request --
# catches a broken build, a dead link, a malformed variant/rating, CSP
# drift between _headers/vercel.json/netlify.toml, or a lint/format issue
# before it ever reaches a real deploy, instead of relying on someone
# remembering to run these by hand first.
#
# Note: as of the domain still being the "your-domain-here.com" placeholder
# (see scripts/build-site-data.js), this workflow is EXPECTED to fail on
# the "Live-domain placeholder" check until a real production domain is
# set and `npm run build-data` is re-run -- that's the check doing its job,
# not a broken pipeline.

# Minutes-saving notes (added to stop this workflow burning Actions minutes):
#   * paths-ignore: doc-only commits (*.md, docs/) don't trigger a run.
#   * concurrency: a newer push cancels the older in-progress run instead of
#     letting both finish.
#   * PUPPETEER_SKIP_DOWNLOAD: this job runs lint/format/qa only -- none of
#     which need a browser -- so we skip Puppeteer's ~150MB Chromium download,
#     which was the single biggest chunk of every `npm install` here.
#   * npm cache: setup-node caches ~/.npm keyed on the lockfile so repeat
#     installs are near-instant.
# The biggest lever of all, though, is repo visibility: GitHub Actions is
# FREE and UNLIMITED on public repos. This is a static marketing site with no
# real secrets committed (keys are placeholders / GitHub Secrets), so making
# the repo public removes the minutes cap entirely.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: npm i -g pnpm && pnpm install --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
