name: CMS Auto-Publisher

# Automatically batches and publishes content changes made in Sveltia CMS (/admin).
#
# HOW IT WORKS:
# 1. When Savanna saves an entry in /admin, Sveltia commits to a branch matching `cms/**`.
# 2. This workflow starts and waits for a 3-minute quiet window (debounce).
# 3. If Savanna saves more edits during that window, GitHub cancels the previous run
#    and restarts the 3-minute timer (via `cancel-in-progress: true`).
# 4. Once 3 minutes elapse with no further saves, every active `cms/**` branch is
#    merged into `main` one at a time WITHOUT committing, and the merge RESULT (what
#    the merge would actually add to main) is checked against a CONTENT-ONLY
#    ALLOW-LIST (see is_allowed_path below): only the JSON files and images Sveltia
#    itself writes per admin/config.yml, as regular files (no symlinks/submodules).
#    A branch that fails -- it touches anything else (workflows, scripts, the Worker,
#    admin/, storefront JS/CSS, HTML, headers, package files...), contains a merge
#    commit, shares no history with main, or conflicts -- has its merge aborted, is
#    SKIPPED and is flagged with an ::error:: annotation naming it.
# 5. Every branch that passes is committed into `main` in one batch. One bad branch
#    does not hold the others hostage: the owner's legitimate saves still go live,
#    and the run is failed red at the very end so the rejected branch is noticed.
# 6. Full data compilation and static QA gates run before pushing to guarantee zero breakage.
#    They run WITHOUT ambient git credentials (`persist-credentials: false`); the token is
#    only handed to the fetch (unset before any merge) and to the push step, which also
#    disables git hooks.
# 7. Netlify detects the single push to `main` and runs EXACTLY ONE production build.
# 8. Merged CMS branches are deleted (only if they still point at the commit that was
#    checked -- a save made mid-run is kept) and their PRs closed, marking entries
#    published in Sveltia. A rejected branch is not contained in main, so it and its PR
#    stay for the owner to review or delete by hand.
# 9. If any branch was rejected the run then fails with an ::error:: summary.
#
# LIMITS OF THE GATE: it only matters while `main` has a ruleset blocking direct
# pushes (otherwise a token that can push `cms/*` can push `main`). And a push to
# `cms/**` runs THIS FILE AS IT IS IN THE PUSHED COMMIT, so a branch cut from an
# older commit replays an older (ungated) version of this workflow. The real fix is
# a ruleset on `main` plus publishing with a token that GITHUB_TOKEN-based workflows
# cannot use (e.g. a GitHub App token in an environment restricted to `main`).

on:
  push:
    branches:
      - 'cms/**'
  workflow_dispatch:
    inputs:
      immediate:
        description: "Skip 3-minute debounce window and publish immediately"
        required: false
        default: false
        type: boolean

concurrency:
  group: cms-auto-publisher
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  batch-and-publish:
    name: Batch & Publish CMS Edits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Debounce Window (Batching Consecutive Saves)
        if: ${{ !inputs.immediate }}
        run: |
          set -euo pipefail
          echo "CMS edit detected from Sveltia (/admin)."
          echo "Waiting 180 seconds (3 minutes) to batch consecutive saves into a single production build..."
          sleep 180
          echo "Quiet window elapsed. Proceeding to batch and publish."

      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Do NOT leave the token in .git/config: the merged tree's scripts
          # (build-site-data.js, smoke-test.js, qa-check.js) run later in this job
          # and must not be able to push. The final step authenticates explicitly.
          persist-credentials: false

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Batch Merge CMS Branches
        id: merge-cms
        env:
          # Only the fetch needs the token; it is unset right after (see below). The
          # repository is public, so the fetch would succeed unauthenticated; the token
          # is passed anyway so the step keeps working against rate limits or if the
          # repository is ever made private.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "Y'allternative CMS Publisher"
          git config user.email "bot@yallternativeliving.com"

          # Same header actions/checkout would have persisted, handed to git through
          # its environment (GIT_CONFIG_COUNT/KEY/VALUE) rather than `git -c ...` on
          # the command line. GitHub masks secrets.GITHUB_TOKEN in the log but NOT
          # values derived from it, and an argv credential is visible in /proc and in
          # any future `set -x`; the base64 form is therefore masked explicitly first.
          B64=$(printf '%s' "x-access-token:${GITHUB_TOKEN}" | base64 -w0)
          echo "::add-mask::${B64}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${B64}"
          unset B64
          git fetch origin --prune
          # Drop the credential AND the token before any merge runs: git hooks (which
          # `npm ci` install scripts could have planted in .git/hooks) inherit this
          # environment. The next step, which runs code from the merged tree, is its
          # own shell and never had either.
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GITHUB_TOKEN

          # ------------------------------------------------------------------
          # CONTENT-ONLY ALLOW-LIST -- exactly what admin/config.yml lets Sveltia write:
          #   - Products folder collection  -> assets/data/products/<id>.json
          #   - Journal folder collection   -> assets/data/journal/<slug>.json
          #   - Singletons                  -> assets/data/catalog-config.json, events.json,
          #                                    site-reviews.json, content.json, quiz.json
          #   - media_folder                -> assets/img/<name> (photo uploads, slugified
          #                                    lower-case names). Every `widget: image`
          #                                    carries `accept: "image/jpeg,image/png"`,
          #                                    so only .jpg/.jpeg/.png (no svg, which can
          #                                    carry script; no webp/avif/gif -- the
          #                                    optimizer derives those).
          # None of these folders nests, so each folder rule matches ONE level only (the
          # path's dirname must BE the folder: a bash `case` `*` also matches `/`). Other
          # JSON under assets/data/ (locales/, the i18n basis, the brand glossary,
          # search-enrichment, social-feed, the compiled products.json) is not written by
          # the CMS. Anything else must go through a reviewed pull request, never this bot.
          # ------------------------------------------------------------------
          is_allowed_path() {
            case "$1" in *[![:print:]]*) return 1 ;; esac
            case "${1%/*}" in
              assets/data)
                case "$1" in
                  assets/data/catalog-config.json | assets/data/events.json | \
                    assets/data/site-reviews.json | assets/data/content.json | \
                    assets/data/quiz.json) return 0 ;;
                esac
                ;;
              assets/data/products | assets/data/journal)
                case "$1" in *.json) return 0 ;; esac
                ;;
              assets/img)
                case "$1" in *.jpg | *.jpeg | *.png) return 0 ;; esac
                ;;
            esac
            return 1
          }

          # Paths come from the branch, so they are attacker-chosen bytes. Everything
          # echoed from git goes through this first: a name containing a newline must
          # not be able to start a `::workflow-command::` line in the log.
          printable() {
            printf '%s' "$1" | LC_ALL=C tr -c '[:print:]' '?'
          }

          # Aborts the in-progress merge (or, if it never started, restores HEAD).
          abort_merge() {
            git merge --abort 2>/dev/null || git reset -q --hard HEAD
          }

          # Find all remote branches matching origin/cms/*
          CMS_BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/cms/ || true)

          if [ -z "$CMS_BRANCHES" ]; then
            echo "No CMS branches pending publication."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "rejected=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found pending CMS branches:"
          echo "$CMS_BRANCHES"

          merged_count=0
          rejected_branches=""
          raw_diff=$(mktemp)

          for branch in $CMS_BRANCHES; do
            branch_clean=$(echo "$branch" | tr -d '\r\n ')
            [ -z "$branch_clean" ] && continue

            echo "::group::Checking $branch_clean"

            # A branch with no common ancestor is not something Sveltia produces.
            if ! git merge-base origin/main "$branch_clean" >/dev/null 2>&1; then
              echo "::error title=CMS branch shares no history with main::$branch_clean was NOT merged: it has no merge base with main. Other CMS branches still publish; review or delete this one."
              rejected_branches="${rejected_branches}${branch_clean} "
              echo "::endgroup::"
              continue
            fi

            # Already contained in main (e.g. a run whose cleanup was cut short).
            if git merge-base --is-ancestor "$branch_clean" HEAD; then
              echo "::notice title=CMS branch has no changes::$branch_clean is already in main; nothing to merge (it is deleted at cleanup)."
              echo "::endgroup::"
              continue
            fi

            # Sveltia only adds plain commits on top of main. A merge commit can give the
            # branch two merge bases with main, and then a crafted branch whose three-dot
            # diff shows one JSON file can still revert scripts on main when merged.
            if [ -n "$(git rev-list --merges "origin/main..${branch_clean}")" ]; then
              echo "::error title=CMS branch contains a merge commit::$branch_clean was NOT merged: it contains a merge commit, which Sveltia never writes. Other CMS branches still publish; review or delete this one."
              rejected_branches="${rejected_branches}${branch_clean} "
              echo "::endgroup::"
              continue
            fi

            # Merge WITHOUT committing, then gate the RESULT: the index against HEAD is
            # exactly what this branch would add to main (on top of any branch merged
            # before it in this batch). A conflict aborts this merge only.
            if ! git merge --no-ff --no-commit "$branch_clean" >/dev/null 2>&1; then
              conflicts=$(git diff --name-only -z --diff-filter=U | tr '\0' ' ' | LC_ALL=C tr -c '[:print:]' '?')
              abort_merge
              echo "::error title=CMS branch conflicts with main::$branch_clean was NOT merged: it conflicts with main (or with a CMS branch merged before it in this run) in: ${conflicts% }. Other CMS branches still publish; review or delete this one."
              rejected_branches="${rejected_branches}${branch_clean} "
              echo "::endgroup::"
              continue
            fi

            # --raw -z prints ":<old mode> <new mode> <old sha> <new sha> <status>" NUL
            # "<path>" NUL per path; --no-renames lists BOTH sides of a rename. The new
            # mode is 000000 for a deletion, 120000 for a symlink, 160000 for a submodule.
            git diff --cached --raw -z --no-renames HEAD -- >"$raw_diff"
            bad_paths=""
            path_count=0
            while IFS= read -r -d '' meta && IFS= read -r -d '' changed; do
              path_count=$((path_count + 1))
              shown=$(printable "$changed")
              read -r _old_mode new_mode _rest <<<"${meta#:}"
              if ! is_allowed_path "$changed"; then
                echo "  BLOCKED  $shown"
                bad_paths="${bad_paths}${shown} "
                continue
              fi
              case "$new_mode" in
                000000 | 100644 | 100755)
                  echo "  ok       $shown"
                  ;;
                120000)
                  echo "  BLOCKED  $shown (symlink)"
                  bad_paths="${bad_paths}${shown} (symlink) "
                  ;;
                *)
                  echo "  BLOCKED  $shown (mode $new_mode is not a regular file)"
                  bad_paths="${bad_paths}${shown} (mode ${new_mode}) "
                  ;;
              esac
            done <"$raw_diff"

            if [ "$path_count" -eq 0 ]; then
              abort_merge
              echo "::notice title=CMS branch has no changes::$branch_clean adds nothing to main; skipping it (it is left in place until it is contained in main)."
              echo "::endgroup::"
              continue
            fi

            if [ -n "$bad_paths" ]; then
              abort_merge
              echo "::error title=CMS branch touches non-content files::$branch_clean was NOT merged. Merging it would change paths outside the content allow-list (or add a symlink or submodule): ${bad_paths% }. Sveltia only writes the assets/data/ JSON files and assets/img/ .jpg/.png uploads named in admin/config.yml; anything else must land through a reviewed pull request. Other CMS branches still publish; review or delete this one."
              rejected_branches="${rejected_branches}${branch_clean} "
              echo "::endgroup::"
              continue
            fi

            echo "Merging $branch_clean into main..."
            git commit -q -m "content(cms): batch merge $branch_clean into main"
            merged_count=$((merged_count + 1))
            echo "::endgroup::"
          done
          rm -f "$raw_diff"

          # Rejected branches are reported, not fatal here: the branches that passed
          # still get built, gated and pushed below so the owner's legitimate saves go
          # live. The final "Fail On Rejected CMS Branches" step turns the run red
          # once publishing is done. (Trailing space trimmed from the list.)
          rejected="${rejected_branches% }"
          echo "rejected=${rejected}" >> "$GITHUB_OUTPUT"
          if [ -n "$rejected" ]; then
            echo "Rejected (skipped, not merged): ${rejected}"
          fi

          if [ "$merged_count" -eq 0 ]; then
            echo "No CMS branch passed the gate with changes; nothing to publish."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merged $merged_count CMS branch(es) into main."
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Compile Data & Run Sanity Gates
        if: steps.merge-cms.outputs.has_changes == 'true'
        # No GITHUB_TOKEN / GH_TOKEN here on purpose: this step executes code from the
        # merged tree and must not be able to push or call the GitHub API.
        run: |
          set -euo pipefail
          echo "Rebuilding site data and product pages..."
          node scripts/build-site-data.js

          if [ -n "$(git status --porcelain)" ]; then
            echo "Adding regenerated data files to commit..."
            git add -A
            git commit -m "build(data): compile catalog, pages, and sitemap from batched CMS edits"
          fi

          echo "Running fast smoke gate..."
          node scripts/smoke-test.js

          echo "Running static QA assertion gate..."
          node scripts/qa-check.js

      - name: Push to Main & Clean Up CMS Branches
        if: steps.merge-cms.outputs.has_changes == 'true'
        env:
          # Token is scoped to this step only (explicit push auth + `gh pr close`).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Authenticate git explicitly for this step only (checkout ran with
          # persist-credentials: false, so no token was ever written to .git/config).
          # The header goes through git's environment, not argv: GitHub masks the raw
          # token but not the base64 form derived from it, so that is masked here and
          # kept off the command line (see the merge step for the same pattern).
          # core.hooksPath=/dev/null: earlier steps ran npm install scripts and code
          # from the merged tree, and a hook they left in .git/hooks would otherwise run
          # with this credential in its environment (GIT_CONFIG_* outranks .git/config).
          B64=$(printf '%s' "x-access-token:${GITHUB_TOKEN}" | base64 -w0)
          echo "::add-mask::${B64}"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${B64}"
          export GIT_CONFIG_KEY_1="core.hooksPath"
          export GIT_CONFIG_VALUE_1="/dev/null"
          # gh reads GH_TOKEN; the raw token is not needed past this point.
          unset B64 GITHUB_TOKEN

          echo "Pushing batched publication to origin/main..."
          git push origin main

          echo "Cleaning up merged CMS remote branches..."
          # Only a branch now contained in main is deleted (a rejected one was never
          # merged, so it survives for the owner), and only while it still points at the
          # commit this run fetched: --force-with-lease refuses the delete if a save
          # landed on the branch mid-run, so that save is kept for the next run.
          CMS_REFS=$(git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin/cms/ || true)
          while read -r branch_clean fetched_sha; do
            [ -z "$branch_clean" ] && continue
            if ! git merge-base --is-ancestor "$fetched_sha" HEAD; then
              echo "Skipping delete of $branch_clean: not merged into main."
              continue
            fi
            remote_name="${branch_clean#origin/}"
            echo "Deleting remote branch: $remote_name"
            git push --force-with-lease="refs/heads/${remote_name}:${fetched_sha}" \
              origin --delete "$remote_name" </dev/null ||
              echo "Kept $remote_name: it changed after this run fetched it; the next run publishes it."
          done <<<"$CMS_REFS"

          echo "Closing published CMS pull requests..."
          # Only PRs whose head commit is now in main: not a rejected branch's PR, and
          # not one whose branch moved on after the fetch (an unknown commit fails the
          # ancestor test, so it is left open too).
          OPEN_PRS=$(gh pr list --base main --state open --limit 100 --json number,headRefName,headRefOid \
            -q '.[] | select(.headRefName | startswith("cms/")) | "\(.number) \(.headRefOid)"' || true)
          while read -r pr head_oid; do
            [ -z "$pr" ] && continue
            if ! git merge-base --is-ancestor "$head_oid" HEAD 2>/dev/null; then
              echo "Leaving PR #$pr open: its head commit is not in main."
              continue
            fi
            echo "Closing PR #$pr..."
            gh pr close "$pr" --comment "Automatically batched and published to main by CMS Auto-Publisher." </dev/null || true
          done <<<"$OPEN_PRS"

          echo "Publication complete. Netlify will now build once for this entire editing session."

      - name: Fail On Rejected CMS Branches
        # Runs after publishing (not `if: always()` -- a failed gate or push above
        # already fails the run on its own) so the good branches went live first and
        # the run is still red for the one that did not.
        if: steps.merge-cms.outputs.rejected != ''
        env:
          REJECTED: ${{ steps.merge-cms.outputs.rejected }}
        run: |
          set -euo pipefail
          echo "::error title=CMS branch(es) rejected::Not merged: ${REJECTED}. Each would change files outside the content allow-list or add a symlink/submodule, contains a merge commit, conflicts with main, or shares no history with main (see the merge step log). Everything else that passed was published. Review or delete the rejected branch(es); they were left in place."
          exit 1
