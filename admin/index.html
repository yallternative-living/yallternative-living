<!DOCTYPE html>
<!-- lang is set here rather than left to Sveltia, which only applies one after
     its JS boots -- until then a screen reader has no language to announce the
     page in, and the document is invalid HTML on its own. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Y'allternative Living — Content Management System</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <!-- Exact snippet from sveltiacms.app/en/docs/start -- deliberately no
         stylesheet <link> (Sveltia bundles its own CSS; a stray stylesheet
         link is a common copy-paste mistake from older Netlify/Decap CMS
         setups) and no type="module" on the script tag. See README
         section 20 before touching this file or config.yml. -->
    <!-- Pinned to an exact version on purpose (no ^/latest) so a bad
         upstream release can't silently break /admin. 0.33.0 was ~140
         releases behind current; bumped 2026-07-22. When updating, check
         https://github.com/sveltia/sveltia-cms/releases and bump the
         version here deliberately.

         integrity: a version pin trusts unpkg to keep serving the same bytes
         for that version. This page holds a GitHub token with write access to
         the repository, so the browser verifies the bundle itself and refuses
         to run anything else. crossorigin="anonymous" is required for the
         check on a cross-origin script (unpkg sends
         Access-Control-Allow-Origin: *).

         The hash below is sha384 of
         https://unpkg.com/@sveltia/cms@0.172.4/dist/sveltia-cms.js
         (1,975,506 bytes), confirmed byte-identical from jsdelivr. WHEN YOU
         BUMP THE VERSION YOU MUST RECOMPUTE IT, or /admin will not load:
           curl -sL https://unpkg.com/@sveltia/cms@<version>/dist/sveltia-cms.js \
             | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.172.4/dist/sveltia-cms.js"
      integrity="sha384-Sj4Mfbg9OjjwG2ZE/YeUYu7xbZRTXGFg/wa/nszj3KzItKuRLEmGqSpV5C9YI2Ge"
      crossorigin="anonymous"
    ></script>
    <!-- Same-origin helper (allowed by the /admin CSP's script-src 'self'):
         renames Sveltia's hardcoded "Files" wording to the section's own
         label. Safe to remove; the stock UI just says "Files" again. -->
    <script src="cms-labels.js" defer></script>
  </body>
</html>
