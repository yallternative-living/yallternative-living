  # ==================================================================
  # 7. APOTHECARY PRODUCT QUIZ
  # ==================================================================
  - name: quiz
    label: "7. Quiz"
    icon: quiz
    description: "The recommendation quiz on the shop page: its banner wording, the questions shoppers answer, and which products each answer recommends. Its on/off switch is under 6 → Site Settings."
    file: assets/data/quiz.json
    format: json
    # No side-by-side preview: for a settings/catalogue form it only re-lists
    # every field as label + value beside the field itself -- twice the
    # screen for the same information (2026-09-03). The Journal keeps its
    # preview, where rendered post text is actually useful.
    editor:
      preview: false
    fields:
      - { name: eyebrow, label: "Banner eyebrow", widget: string, hint: "The small line above the banner title." }
      - { name: title, label: "Banner title", widget: string }
      - { name: subtitle, label: "Banner subtitle", widget: text }
      - { name: buttonText, label: "Button text", widget: string, hint: "The button that opens the quiz." }
      - { name: modalTitle, label: "Quiz window title", widget: string }
      - { name: modalSubtitle, label: "Quiz window subtitle", widget: text }
      - name: questions
        label: Questions
        widget: list
        label_singular: Question
        collapsed: true
        summary: "{{fields.step}}. {{fields.title}}"
        fields:
          - { name: title, label: "Question", widget: string }
          - { name: subtitle, label: "Question subtitle", widget: string, required: false }
          - { name: step, label: "Step number", widget: number, value_type: int, hint: "The order the questions are asked in, starting at 1." }
          - name: options
            label: Answers
            widget: list
            label_singular: Answer
            collapsed: true
            summary: "{{fields.icon}} {{fields.label}}"
            fields:
              - { name: label, label: "Answer wording", widget: string }
              - {
                  name: description,
                  label: "Answer description",
                  widget: string,
                  required: false
                }
              - { name: icon, label: "Emoji", widget: string, required: false }
              - name: recommendedProductIds
                label: "Recommended products"
                widget: list
                required: false
                hint: "The products this answer points shoppers to."
                field:
                  {
                    name: productId,
                    label: Product,
                    widget: relation,
                    collection: _singletons,
                    file: products,
                    search_fields: ["products.*.id", "products.*.name"],
                    value_field: "products.*.id",
                    display_fields: ["products.*.name"]
                  }
              - name: categories
                label: "Recommended categories"
                widget: list
                required: false
                hint: "Whole categories this answer counts towards."
                field:
                  {
                    name: category,
                    label: Category,
                    widget: select,
                    options:
                      [
                        "salves",
                        "body-care",
                        "bath-soaks",
                        "sprays",
                        "apparel",
                        "gift-cards"
                      ]
                  }
              - {
                  name: matchBundles,
                  label: "Also suggest gift bundles",
                  widget: boolean,
                  default: false,
                  required: false
                }
              - {
                  name: matchFeatured,
                  label: "Also suggest featured products",
                  widget: boolean,
                  default: false,
                  required: false
                }
              - {
                  name: scoreWeight,
                  label: "Weight",
                  widget: number,
                  default: 5,
                  value_type: int,
                  hint: "How strongly this answer counts towards its recommendations, e.g. 5."
