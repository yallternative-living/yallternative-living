                widget: string
                required: false
                pattern:
                  [
                    "^$|^https?://.*",
                    "Must be a valid URL starting with https://, or leave blank."
                  ]

          # --- Connection codes (paste once, rarely touched) ------------
          # Hidden on purpose: these are pasted once from another dashboard and
          # essentially never touched again. `pattern` no longer does anything once a
          # field is hidden -- Sveltia only runs pattern validation on fields with a
          # visible widget (confirmed by reading validateAnyField in Sveltia's own
          # source, which explicitly skips 'hidden' fields) -- so the real safety net is
          # now build time only: validateSiteIds in scripts/build-site-data.js still
          # stops the deploy on an implausible value. Left declared (not deleted) so the
          # CMS keeps writing back whatever is already saved instead of dropping it --
          # same reasoning as giftUpId below. If Savanna ever needs to change one of
          # these herself, unhide it (widget: string) first; until then, only a
          # developer editing content.json (or temporarily unhiding the field) can
          # change it.
          - { name: kitFormAction, label: "Kit newsletter form link", widget: hidden, required: false }
          - {
              name: tawkToPropertyId,
              label: "Tawk.to Property ID",
              widget: hidden,
              required: false,
              pattern: ["^$|^[A-Za-z0-9]{1,40}$", "Copy the Property ID exactly from Tawk.to: letters and numbers only, no spaces or punctuation."]
            }
          - {
              name: tawkToWidgetId,
              label: "Tawk.to Widget ID",
              widget: hidden,
              required: false,
              pattern: ["^$|^[A-Za-z0-9]{1,40}$", "Copy the Widget ID exactly from Tawk.to: letters and numbers only, no spaces or punctuation."]
            }
          - {
              name: formspreeContactId,
              label: "Formspree contact form ID",
              widget: hidden,
              required: false,
              pattern: ["^$|^[A-Za-z0-9_-]{1,64}$", "Just the short form code from the Formspree URL (letters, numbers, - and _) -- not the whole web address."]
            }
          - {
              name: formspreeReviewId,
              label: "Formspree review form ID",
              widget: hidden,
              required: false,
              pattern: ["^$|^[A-Za-z0-9_-]{1,64}$", "Just the short form code from the Formspree URL (letters, numbers, - and _) -- not the whole web address."]
            }
          - {
              name: formspreeRestockId,
              label: "Formspree launch-alert form ID",
              widget: hidden,
              required: false,
              pattern: ["^$|^[A-Za-z0-9_-]{1,64}$", "Just the short form code from the Formspree URL (letters, numbers, - and _) -- not the whole web address."]
            }
          - {
              name: umamiWebsiteId,
              label: "Umami analytics ID",
              widget: hidden,
              required: false,
              pattern: ["^(YOUR_UMAMI_WEBSITE_ID|[A-Za-z0-9-]{0,64})$", "Paste the Website ID from Umami: letters, numbers and hyphens only."]
            }
          # Hidden on purpose (widget: hidden = stored, but no UI control).
          # Gift Up! is only half-built: setting a real ID generates a
          # working Gift Up! widget, but nothing hides the built-in
          # gift-card button, so both would render at once. The field
          # stays declared so the CMS round-trips the value instead of
          # dropping it on save -- unhide it (widget: string) only after
          # the bypass in main.js exists. See DEVELOPMENT.md section 18.
          - {
              name: giftUpId,
              label: "Gift Up! account code",
              widget: hidden,
              required: false,
              pattern:
                [
                  "^(YOUR_GIFTUP_ID|[A-Za-z0-9-]{0,64})$",
                  "Gift Up! account codes are letters, numbers and hyphens only."
                ]
            }

