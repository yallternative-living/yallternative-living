  # ==================================================================
  # 6. APOTHECARY PRODUCT QUIZ
  # ==================================================================
          - name: search
            label: "🔎 Search Settings (popular chips & extra search words)"
            widget: object
            collapsed: true
            required: false
            hint: "The chips under the site search box and the words the search understands. Nothing here is shown on a product, so this is the right place for the words shoppers actually type."
            fields:
              - { name: chipsTitle, label: "Chips heading", widget: string, required: false, default: "Popular Searches" }
              - name: popularChips
                label: "Popular search chips (shown in the search box and on the no-results screen)"
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.label}} → {{fields.query}}"
                hint: "Keep condition names (eczema, insomnia, arthritis) out of the label: the label is visible copy. The query can be anything the search understands."
                fields:
                  - { name: label, label: "Chip text", widget: string }
                  - { name: query, label: "Search it runs", widget: string }
                  - name: icon
                    label: Icon
                    widget: select
                    default: sparkle
                    options: [moon, waves, droplet, shield, calendar, gift, sparkle, leaf]
              - name: extraSynonyms
                label: "Extra search words"
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.key}}: {{fields.terms}}"
                hint: "When a shopper types any of the words in a group, the search also looks for the group's key word. Example: key 'bath_tea', words 'tub tea, bath sachet'. Use underscores in the key for two-word ideas (dry_skin, bug_spray). These translate what a shopper typed and never appear on a product, so symptom words are fine here; wound, infection, cure and treat are still refused by the build."
                fields:
                  - { name: key, label: "Key word the search should look for", widget: string }
                  - { name: terms, label: "Words shoppers type", widget: list, allow_add: true }
  - name: quiz
    label: "Apothecary Quiz"
    icon: quiz
    files:
      - name: quiz
        label: "Quiz Questions & Recommendations"
        file: assets/data/content.json
        format: json
        fields:
          - name: quiz
            label: "Quiz Questions & Options"
            widget: object
            fields:
              - name: questions
                label: Questions
                widget: list
                fields:
                  - { name: id, label: "Question ID", widget: string }
                  - { name: name, label: "Question Field Name", widget: string }
                  - { name: step, label: "Step Number", widget: number, value_type: int }
                  - { name: title, label: "Question Title", widget: string }
                  - { name: subtitle, label: "Question Subtitle", widget: string, required: false }
                  - name: options
                    label: Options
                    widget: list
                    fields:
                      - { name: value, label: "Option Key / Value", widget: string }
                      - { name: label, label: "Option Label", widget: string }
                      - {
                          name: description,
                          label: "Option Description",
                          widget: string,
                          required: false
                        }
                      - { name: icon, label: "Icon / Emoji", widget: string, required: false }
                      - name: recommendedProductIds
                        label: "Recommended Products"
                        widget: list
                        required: false
                        field:
                          {
                            name: productId,
                            label: Product,
                            widget: relation,
                            collection: products,
                            file: products,
                            search_fields: ["products.*.id", "products.*.name"],
                            value_field: "products.*.id",
                            display_fields: ["products.*.name"]
                          }
                      - name: categories
                        label: "Target Categories"
                        widget: list
                        required: false
                        field:
                          {
                            name: category,
                            label: Category,
                            widget: select,
                            options:
                              [
                                "salves",
                                "body-care",
                                "bath-soaks",
                                "sprays",
                                "apparel",
                                "gift-cards"
                              ]
                          }
                      - {
                          name: matchBundles,
                          label: "Match Bundles",
                          widget: boolean,
                          default: false,
                          required: false
                        }
                      - {
                          name: matchFeatured,
                          label: "Match Featured",
                          widget: boolean,
                          default: false,
                          required: false
                        }
                      - {
                          name: scoreWeight,
                          label: "Recommendation Weight",
                          widget: number,
                          default: 5,
                          value_type: int
                        }
