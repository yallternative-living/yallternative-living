# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Y'ALLTERNATIVE LIVING -- Sveltia CMS configuration
# ----------------------------------------------------------------------
# This is the editor Savanna uses at /admin instead of hand-editing JSON
# files in a text editor. It's split into seven separate top-level
# sections in the /admin sidebar, on purpose, so Savanna sees exactly
# what she can do at a glance instead of hunting through one generic
# "catalog" menu:
#   1. Shop & Products              -- assets/data/products.json
#   2. Markets & Pop-Ups            -- assets/data/events.json
#   3. Customer Reviews             -- assets/data/site-reviews.json
#   4. Journal                      -- assets/data/journal/*.json (one post per file)
#   5. Social Media Feed            -- assets/data/social-feed.json
#   6. Site Settings               -- assets/data/content.json
#   7. Quiz                         -- assets/data/quiz.json
#
# Every section except the Journal is a Sveltia `singleton` (one data file
# each) rather than a one-file `collection`: a file collection always shows
# a middle "list of files" page with a single row in it, so every section
# took two clicks and looked like a duplicate. A singleton opens its editor
# straight from the sidebar. Sveltia only lists singletons directly when at
# least one regular collection exists (with none it folds them back into a
# single "Files" collection -- the very thing this avoids); the Journal is
# that collection, and it is the one section that genuinely is a list.
# Relation widgets that point at the products file therefore use
# `collection: _singletons`. Sveltia labels the singleton group and every
# singleton editor header "Files" with no config option to change it;
# admin/cms-labels.js renames those to "Sections" / the section's own label.
# Full setup instructions (GitHub repo, first login) are in DEVELOPMENT.md
# section 20 -- read that before changing anything here. For the
# click-by-click version, see docs/SETUP-GUIDE.md Step 9.
#
# backend.repo below points at the real repo:
# github.com/yallternative-living/yallternative-living. To actually log in at
# /admin you pick ONE of two GitHub sign-in methods (Netlify is NOT involved --
# its old Git Gateway / OAuth login is deprecated):
#   (A) Instant, zero setup: "Sign in with Token" on the /admin login screen
#       (paste a GitHub token -- good for logging in today).
#   (B) Permanent "Sign in with GitHub" button: deploy the login Worker in
#       cms-auth/ and set backend.base_url below to its URL.
# Full steps for both are in DEVELOPMENT.md section 20.
#
# Every field below maps 1:1 to a real field already used in
# assets/data/products.json -- nothing here was invented; if a field
# isn't listed, it isn't part of the real catalog schema. After saving
# a change here, Sveltia commits straight to the repo, and the site's
# own deploy step re-runs `node scripts/build-site-data.js` to
# regenerate everything derived from it (see netlify.toml /
# vercel.json) -- Savanna does NOT need to run that script by hand.

backend:
  name: github
  # Must match the repo the site actually pushes to -- `git remote -v`
  # says github.com/yallternative-living/yallternative-living (the old
  # StevenMGlenn/yallternative-living value here pointed at a repo that
  # doesn't exist anymore, which would make every /admin login fail).
  repo: yallternative-living/yallternative-living
  branch: main
  # base_url = the "Sign in with GitHub" login service for /admin.
  #
  # This used to be left unset so Netlify could act as the default OAuth
  # provider -- but Netlify DEPRECATED that (its "Git Gateway / OAuth"),
  # which is the dead end the /admin login kept hitting. We now run our own
  # tiny login Worker on Cloudflare (the top-level cms-auth/ folder,
  # alongside the checkout Worker this site already uses), so /admin no longer
  # depends on Netlify for anything. See DEVELOPMENT.md section 20.
  #
  # >>> ONE VALUE TO FILL IN (Steven, once, after deploying cms-auth) <<<
  # Uncomment the base_url line below and replace YOUR-SUBDOMAIN with the real
  # Worker URL Cloudflare shows after deploy (it looks like
  # https://yallternative-cms-auth.<your-subdomain>.workers.dev), then set that
  # same URL's /callback as the GitHub OAuth App's callback.
  #
  # SECURITY -- keep base_url COMMENTED OUT until the real Worker exists.
  # Shipping a placeholder URL live would point the "Sign in with GitHub"
  # button at a workers.dev hostname nobody owns yet; someone could register
  # that exact name and use it to intercept a login and phish a repo-scoped
  # token. While it's commented out, /admin just uses the "Sign in with Token"
  # option (works today, zero setup -- DEVELOPMENT.md section 20), which is what
  # we tell Savanna to use anyway.
  # base_url: https://yallternative-cms-auth.YOUR-SUBDOMAIN.workers.dev

site_url: https://yallternativeliving.com
display_url: https://yallternativeliving.com
logo_url: /assets/img/logo.png

# media_folder = where uploads are stored in the repo; public_folder = the path
# written into products.json for each uploaded image. Both are /assets/img.
# (The build's JSON-LD image URLs normalize a leading slash -- see the
# .replace(/^\/+/, "") in scripts/build-site-data.js -- so a CMS-uploaded
# "/assets/img/x.jpg" can't produce a double-slash "domain.com//assets/img" URL,
# even though existing hand-entered paths are relative "assets/img/x.jpg".)
media_folder: /assets/img
public_folder: /assets/img

# Makes the /admin "Assets" (photo library) friendlier and harder to break.
# The panel itself is Sveltia's built-in UI -- its name and layout aren't
# ours to rename -- but how uploads behave IS configurable, and these two
# settings matter most for a non-technical owner uploading phone photos:
#   - slugify_filename: auto-tidies messy upload names so links never break.
#     "IMG 4823 (1).JPG" is saved as "img-4823-1.jpg" (the extension is kept,
#     so scripts/optimize-images.js -- which only processes .jpg -- still
#     generates the responsive/webp versions on deploy).
#   - max_file_size: rejects an accidental huge upload (e.g. a video) with a
#     clear message instead of committing a giant file to the repo. 25 MB is
#     generous headroom for any real photo.
# NOT enabling upload-time image "transformations" on purpose: Sveltia would
# convert uploads to .webp, but optimize-images.js only reads .jpg originals,
# so a converted upload would never get its responsive variants. Optimization
# already happens at build time -- leave it there.
media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 26214400 # 25 MB (25 * 1024 * 1024)

collections:
  # The Journal is a FOLDER collection (one JSON file per post) rather than a
  # singleton: it is the one section that really is a list of things, so
  # /admin shows a proper post list with a "New Post" button. It also keeps
  # sections 1-3 and 5-7 listed directly in the sidebar (see the note at the
  # top of this file). The file name becomes the post's id/URL slug -- the
  # build reads it from the name, never from inside the file.
  - name: journal
    label: "4. Journal"
    label_singular: Post
    icon: article
    description: "Your blog. Click a post to edit it or 'New Post' to write one; Save publishes to the live site in a few minutes. The blog's on/off switch and page heading live under section 6."
    folder: assets/data/journal
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{date}})"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - { name: title, label: "Title", widget: string }
      - {
          name: date,
          label: "Publish date",
          widget: datetime,
          default: "{{now}}",
          format: "YYYY-MM-DD",
          date_format: "MM/DD/YYYY",
          time_format: false
        }
      # Left as a plain box on purpose: this teaser is printed inside a
      # small card on journal.html (and into llms.txt as a one-line
      # summary), so headings/bullets there would break the layout and
      # bold/link marks would just show up as literal ** and [ ].
      - {
          name: excerpt,
          label: "Short teaser",
          widget: text,
          hint: "One or two plain sentences shown on the Journal list. Formatting isn't used here."
        }
      # widget: markdown = Sveltia's rich-text editor: a real toolbar
      # (bold, italic, links, headings, bullet + numbered lists) with a
      # "raw" tab for anyone who'd rather type. It saves MARKDOWN TEXT
      # into the post's own JSON file, not HTML, which is exactly what the site's
      # renderMarkdown() in assets/js/main.js renders -- and because
      # the site escapes everything before formatting it, nothing typed
      # here can turn into live code on the page.
      #   - "markdown" and "richtext" are the same editor in the pinned
      #     Sveltia 0.172.4 (admin/index.html); "markdown" is used here
      #     because it names the format actually stored in the file, and
      #     it's the spelling Netlify/Decap CMS understands too.
      #   - buttons/editor_components are trimmed to exactly what the
      #     site can draw, so nothing Savanna can click comes out broken
      #     on the page: no strikethrough, inline code, block quotes,
      #     code blocks or in-post images. (Heading 2/3 here render as
      #     the post's section/sub-section headings; Heading 1 is left
      #     out because the post title already fills that slot.)
      - name: content
        label: "Post text"
        widget: markdown
        buttons:
          [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
        editor_components: []
        hint: "The toolbar gives you bold, italic, links, headings and lists, and it looks on the site the way it looks here. Leave a blank line between paragraphs."
      - { name: image, label: "Featured photo", widget: image, required: false }
      - name: tags
        label: Topics
        widget: list
        required: false
        field: { name: tag, label: Topic, widget: string }
        hint: "e.g. Apothecary, Botanical Care, Self-Care."
      - name: featuredProductId
        label: "Featured product"
        widget: relation
        required: false
        collection: _singletons
        file: products
        value_field: products.*.id
        display_fields: ["products.*.name"]
        search_fields: ["products.*.name"]
        hint: "Pick a product and the post shows a one-click add-to-cart card for it."
      - name: readingTime
        label: "Reading time"
        widget: string
        required: false
        hint: "e.g. 4 min read. Leave blank and it's worked out from the word count."

singletons:
  - name: products
    label: "1. ⚙️ Shop & Products"
    icon: storefront
    description: "Your whole shop: products and prices, multi-buy deals, category sales, gift bundles and the FAQ. Click an item to edit it or 'Add' to create one; Save publishes in a few minutes."
    file: assets/data/products.json
    format: json
    # No side-by-side preview: for a settings/catalogue form it only re-lists
    # every field as label + value beside the field itself -- twice the
    # screen for the same information (2026-09-03). The Journal keeps its
    # preview, where rendered post text is actually useful.
    editor:
      preview: false
    fields:
      # ==================================================================
      # 1. PRODUCTS (Top Priority - Daily Catalog Management)
      # Everyday fields first (name, category, price, photos, text, stock),
      # then merchandising, then the rarely-touched ones; `id` is last on
      # purpose. Order here only affects the editor, not the site.
      # ==================================================================
      - name: shop
        label: "⚙️ Shop settings"
        widget: object
        collapsed: true
        hint: "Etsy counters, free shipping, cart rewards and the Build-Your-Own Box. You rarely need this."
        fields:
          - { name: name, label: "Shop name", widget: string }
          - { name: etsyShopUrl, label: "Etsy shop link", widget: string }
          - {
              name: rating,
              label: "Etsy star rating",
              widget: number,
              value_type: float,
              hint: "Your shop's real Etsy rating, 0–5, e.g. 4.9."
            }
          - {
              name: reviewCount,
              label: "Etsy review count",
              widget: number,
              value_type: int,
              hint: "Your real Etsy review count, e.g. 320."
            }
          - {
              name: sales,
              label: "Etsy sales count",
              widget: number,
              value_type: int,
              hint: "Your real Etsy sales count, e.g. 1200."
            }
          - {
              name: freeShippingThreshold,
              label: "Free shipping threshold ($)",
              widget: number,
              value_type: int,
              hint: "Orders at or above this amount ship free, e.g. 45. Set to 0 to turn free shipping off."
            }
          - name: shippingMilestones
            label: "Cart reward tiers"
            widget: list
            label_singular: "Reward tier"
            required: false
            collapsed: true
            summary: "${{fields.threshold}} — {{fields.reward}}"
            hint: "Perks unlocked as the cart grows, e.g. $40 free shipping, $60 free pocket salve, $80 10% off."
            fields:
              - {
                  name: threshold,
                  label: "Cart total ($)",
                  widget: number,
                  value_type: int,
                  min: 1,
                  hint: "Order value that unlocks this perk, e.g. 40."
                }
              - {
                  name: reward,
                  label: "Perk name",
                  widget: string,
                  hint: "e.g. Free Tracked Shipping, Free Pocket Salve, Free Vinyl Sticker"
                }
              - {
                  name: icon,
                  label: "Badge icon",
                  widget: select,
                  default: "gift",
                  options:
                    [
                      { label: "Shipping Truck", value: "truck" },
                      { label: "Gift / Perk", value: "gift" },
                      { label: "Star / Sparkle", value: "sparkle" },
                      { label: "Heart", value: "heart" }
                    ]
                }
          - name: customBox
            label: "Build-Your-Own Box"
            widget: object
            required: false
            collapsed: true
            hint: "The pick-your-own bundle on the shop page. Its price is always worked out from the real prices of what the shopper picks, minus the discount below."
            fields:
              - {
                  name: minItems,
                  label: "Minimum items in a box",
                  widget: number,
                  value_type: int,
                  default: 3
                }
              - {
                  name: maxItems,
                  label: "Maximum items in a box",
                  widget: number,
                  value_type: int,
                  default: 5
                }
              - {
                  name: discountPercent,
                  label: "Discount (%)",
                  widget: number,
                  value_type: int,
                  default: 10,
                  hint: "Percent off the combined price of the chosen items."
                }
              - name: eligibleCategories
                label: "Categories shoppers can pick from"
                widget: relation
                multiple: true
                collection: _singletons
                file: products
                value_field: categories.*.id
                display_fields: ["categories.*.label"]
                search_fields: ["categories.*.label"]
                default: ["salves", "body", "soaks", "potions", "ritual"]
                hint: "Apparel and gift cards are usually left out."

      - name: products
        label: Products
        widget: list
        label_singular: Product
        collapsed: true
        summary: "{{fields.name}} — ${{fields.price}} ({{fields.category}})"
        fields:
          - name: name
            label: "Product name"
            widget: string
            hint: "Shown on the card, the product page, the cart and search. Names read as claims — avoid heal, cure, relief, recovery, sleep, treat, repel or a condition name; 'Comfort Salve' or 'Reset Soak' say it without the legal risk."
          - name: category
            label: Category
            widget: relation
            collection: _singletons
            file: products
            value_field: categories.*.id
            display_fields: ["categories.*.label"]
            search_fields: ["categories.*.label"]
            hint: "Add or rename categories under 'Product categories', further down this page."
          - {
              name: price,
              label: "Price (USD)",
              widget: number,
              value_type: float,
              min: 0,
              step: 0.01,
              hint: "e.g. 16 or 16.50"
            }
          - name: image
            label: "Main photo"
            widget: image
            hint: "Shown on the product card and first in the gallery."
          - name: images
            label: "Extra gallery photos"
            widget: list
            label_singular: Photo
            required: false
            field: { name: photo, label: Photo, widget: image }
          - name: blurb
            label: "Product description"
            widget: text
            hint: "The main text shoppers read. Describe what it is and how it's made — no health or medical claims."
          # `description` exists in products.json and is declared here so a
          # CMS save preserves it (it feeds the meta description / share text).
          - name: description
            label: "Search & share blurb"
            widget: text
            required: false
            hint: "Shown in Google results and link previews. Leave blank to use the product description instead."
          - name: stock
            label: "Stock count"
            widget: number
            value_type: int
            min: 0
            required: false
            hint: >-
              Blank = unlimited or made to order. 0 shows 'Sold Out' and
              blocks checkout; 1–5 shows an 'Only 3 left' badge. This
              doesn't sync with Etsy — update it by hand.
          - name: inStock
            label: "In stock"
            widget: boolean
            default: true
            required: false
            hint: "Untick to show 'Sold Out' and a restock sign-up instead of Add to Cart."
          - name: comingSoon
            label: "Coming soon"
            widget: boolean
            default: false
            required: false
            hint: "Shows a 'Coming Soon' badge and replaces the buy button with a launch-alert sign-up."
          - name: estimatedBatchDate
            label: "Expected launch or restock"
            widget: string
            required: false
            hint: "Shown on Coming Soon items, e.g. Early Autumn 2026 or Oct 15."
          - name: featured
            label: "Feature on homepage"
            widget: boolean
            default: false
            required: false
            hint: "Shows this product in the homepage grid."
          - name: bestseller
            label: "Bestseller badge"
            widget: boolean
            default: false
            required: false
            hint: "Adds a 'Bestseller' badge on the card."
          - name: sale
            label: "Sale"
            widget: object
            required: false
            collapsed: true
            hint: "Puts just this product on sale. To discount a whole category, use 'Category sales' further down this page."
            fields:
              - { name: price, label: "Sale price ($)", widget: number, value_type: float }
              - {
                  name: label,
                  label: "Sale name shoppers see",
                  widget: string,
                  hint: "e.g. Spring Sale"
                }
          - {
              name: originalPrice,
              label: "Original price",
              widget: number,
              value_type: float,
              required: false,
              hint: "The crossed-out 'was' price. Usually filled in for you when the product goes on sale."
            }
          - name: variants
            label: "Variants"
            widget: object
            required: false
            collapsed: true
            hint: "Sizes, scents or blends of this one product. Leave empty for a single-option product."
            fields:
              - {
                  name: name,
                  label: "Variant type",
                  widget: string,
                  hint: "e.g. Size, Scent or Blend"
                }
              - name: options
                label: Options
                widget: list
                label_singular: Option
                summary: "{{fields.label}} ({{fields.priceDelta}})"
                hint: >-
                  One option must have a price difference of 0 — that's the
                  base price above. For the others, enter how much more or
                  less they cost, using your real Etsy prices.
                fields:
                  - name: label
                    label: "Option name"
                    widget: string
                    hint: "e.g. 8 oz or Lavender. Don't use [ ] or | — they break the cart."
                  - {
                      name: priceDelta,
                      label: "Price difference",
                      widget: number,
                      value_type: float,
                      default: 0,
                      hint: "0 = same as the base price; use a negative number to charge less."
                    }
                  - {
                      name: soldOut,
                      label: "Sold out?",
                      widget: boolean,
                      required: false,
                      default: false,
                      hint: "Shows the option greyed out and unorderable. Flip it back off when you restock — don't delete the option, or shoppers won't know it exists."
                    }
          - name: ingredients
            label: "Ingredients / materials"
            widget: list
            required: false
            hint: >-
              Copy these from this product's own Etsy listing description,
              not Etsy's generic 'Materials' tag (often the same boilerplate
              across unrelated items). Never make up an ingredient.
          - name: ingredientsLabel
            label: "Ingredients heading"
            widget: string
            required: false
            hint: "Defaults to 'Ingredients'. Use 'Materials' for non-body-care items like the keychain."
          - name: ingredientsNote
            label: "Ingredients note"
            widget: string
            required: false
            hint: "e.g. No essential oils, no added fragrance."
          - name: scent
            label: "Scent"
            widget: string
            required: false
            hint: "One short name, e.g. Lavender, Bourbon Vanilla or Unscented. Products sharing a scent are grouped in the shop's scent filter."
          - name: scentProfile
            label: "Scent notes & intensity"
            widget: object
            required: false
            collapsed: true
            fields:
              - {
                  name: top,
                  label: "Top notes",
                  widget: string,
                  required: false,
                  hint: "e.g. Lavender, Rosemary"
                }
              - {
                  name: heart,
                  label: "Heart notes",
                  widget: string,
                  required: false,
                  hint: "e.g. Chamomile, Tea Tree"
                }
              - {
                  name: base,
                  label: "Base notes",
                  widget: string,
                  required: false,
                  hint: "e.g. Frankincense, Earthy Beeswax"
                }
              - name: intensity
                label: "Scent intensity"
                widget: select
                required: false
                options:
                  - { label: "Unscented", value: "Unscented" }
                  - { label: "Subtle", value: "Subtle" }
                  - { label: "Medium", value: "Medium" }
                  - { label: "Strong", value: "Strong" }
                  - { label: "Bold", value: "Bold" }
              - {
                  name: intensityScore,
                  label: "Intensity score (0–5)",
                  widget: number,
                  value_type: int,
                  min: 0,
                  max: 5,
                  required: false
                }
          - name: usageGuide
            label: "Usage & care"
            widget: object
            required: false
            collapsed: true
            fields:
              - {
                  name: howToApply,
                  label: "How to apply or wear",
                  widget: text,
                  required: false
                }
              - {
                  name: storage,
                  label: "Storage, shelf life or garment care",
                  widget: text,
                  required: false
                }
              - {
                  name: patchTest,
                  label: "Patch test & allergen info",
                  widget: text,
                  required: false
                }
          - name: tags
            label: "Sensitivity & allergen tags"
            widget: select
            multiple: true
            required: false
            options:
              - { label: "Vegan", value: "vegan" }
              - { label: "Unscented", value: "unscented" }
              - { label: "Essential Oil Free", value: "essential-oil-free" }
              - { label: "Sensitive Skin Safe", value: "sensitive-safe" }
              - { label: "Cruelty-Free", value: "cruelty-free" }
              - { label: "Organic Ingredients", value: "organic" }
              - { label: "Locally Sourced / Foraged", value: "locally-sourced" }
          - name: keywords
            label: "Search keywords"
            widget: list
            required: false
            hint: "Extra words shoppers might type: occasions, uses, ingredient names, misspellings (e.g. post-hike, cane sugar, stocking stuffer). These are published with the product, so keep symptoms and conditions like eczema or insomnia OUT — put those under 6 → Search settings → Extra search words, which only translate what a shopper typed."
          - name: concerns
            label: "Shop concerns"
            widget: relation
            multiple: true
            required: false
            collection: _singletons
            file: products
            value_field: concerns.*.id
            display_fields: ["concerns.*.icon", "concerns.*.name"]
            search_fields: ["concerns.*.name"]
            hint: "Which concern filters list this product, e.g. Sore Muscles or Dry Skin."
          - name: pairsWith
            label: "Pairs well with"
            widget: relation
            multiple: true
            required: false
            collection: _singletons
            file: products
            value_field: products.*.id
            display_fields: ["products.*.name"]
            search_fields: ["products.*.name"]
            hint: "Products shown in this item's 'Complete the Ritual' section."
          - name: ritualTitle
            label: "Ritual section headline"
            widget: string
            required: false
            hint: "e.g. The Deep Rest & Nighttime Ritual. Leave blank to use the default under 6 → Site Settings."
          - name: etsyUrl
            label: "Etsy listing link"
            widget: string
            required: false
            hint: "Leave blank for gift cards or site-only items."
          - name: rating
            label: "This item's own Etsy rating"
            widget: object
            required: false
            collapsed: true
            hint: "Only if this exact item has its own reviews on Etsy."
            fields:
              - {
                  name: value,
                  label: "Star rating (0–5)",
                  widget: number,
                  value_type: float
                }
              - {
                  name: count,
                  label: "Number of reviews",
                  widget: number,
                  value_type: int
                }
          # `id` exists in products.json and is declared here so a CMS save
          # preserves it. It is the cart line-item key and the
          # wishlist/review/bundle reference key.
          - name: id
            label: "Product ID"
            widget: string
            required: false
            hint: >-
              Leave blank on a new product and it's made from the name.
              Bundles and reviews use it to find this product, so never
              change it once the product is live — that breaks those links.

      # ==================================================================
      # 2. PROMOTIONS & DEALS (Volume Pricing Rules & Category Sales)
      # ==================================================================
      - name: volumePricing
        label: "Multi-buy deals"
        widget: list
        label_singular: "Deal"
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.label}} — {{fields.name}}"
        hint: "Category volume discounts, e.g. any 2+ 2 oz salves for $15 each. Several deals can run at once."
        fields:
          - { name: name, label: "Deal name", widget: string, hint: "For your reference, e.g. 2oz Salve Multi-Buy" }
          - name: category
            label: "Category"
            widget: relation
            collection: _singletons
            file: products
            value_field: categories.*.id
            display_fields: ["categories.*.label"]
            search_fields: ["categories.*.label"]
          - {
              name: qualifyingVariant,
              label: "Qualifying variant",
              widget: string,
              required: false,
              hint: "e.g. 2oz. Leave blank to count every size in the category."
            }
          - {
              name: minQuantity,
              label: "Minimum quantity",
              widget: number,
              value_type: int,
              default: 2,
              hint: "e.g. 2"
            }
          - {
              name: unitPrice,
              label: "Discounted unit price ($)",
              widget: number,
              value_type: float,
              step: 0.01,
              hint: "e.g. 15"
            }
          - {
              name: label,
              label: "Deal badge wording",
              widget: string,
              hint: "Shown on product cards and in the cart, e.g. 2+ for $15 each"
            }
          - { name: enabled, label: "Deal enabled", widget: boolean, default: true, hint: "Switch off to pause the deal without deleting it." }
          - {
              name: id,
              label: "Deal ID",
              widget: string,
              hint: "A short lowercase code with dashes, e.g. salves-2oz. Don't change it once the deal is live."
            }

      - name: sales
        label: "Category sales"
        widget: list
        label_singular: Sale
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.label}} — {{fields.percentOff}}% off"
        hint: "Put a whole category on sale at once, e.g. 15% off everything in Body & Skin."
        fields:
          - name: category
            label: "Which category is on sale"
            widget: relation
            collection: _singletons
            file: products
            value_field: categories.*.id
            display_fields: ["categories.*.label"]
            search_fields: ["categories.*.label"]
          - {
              name: percentOff,
              label: "Percent off",
              widget: number,
              value_type: int,
              hint: "e.g. 15"
            }
          - {
              name: label,
              label: "Sale name shoppers see",
              widget: string,
              hint: "e.g. Body Care Sale"
            }

      # ==================================================================
      # 3. CURATED GIFT SETS (Pre-made Bundles)
      # ==================================================================
      - name: bundles
        label: "Gift bundles"
        widget: list
        label_singular: Bundle
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.name}} — ${{fields.price}}"
        required: false
        hint: >-
          Pre-made gift sets. Type the set's price; the crossed-out "was"
          price is added up from the products inside. If a customer picks a
          bigger size in the set, that size's extra cost is added on top.
        fields:
          - { name: name, label: "Bundle name", widget: string }
          - name: productIds
            label: "Products in this bundle"
            widget: relation
            multiple: true
            min: 2
            collection: _singletons
            file: products
            value_field: products.*.id
            display_fields: ["products.*.name"]
            search_fields: ["products.*.name"]
            hint: "Pick 2 or more — start typing a product name."
          - {
              name: price,
              label: "Set price ($)",
              widget: number,
              value_type: float,
              min: 1,
              required: false,
              hint: "What the whole set costs, e.g. 34. Keep it a few dollars under the products' own prices added up, or the set is no saving."
            }
          - {
              name: discountPercent,
              label: "Discount percent (backup)",
              widget: number,
              value_type: int,
              min: 0,
              max: 90,
              hint: "Only used if the set price above is left empty. Leave as is."
            }
          - { name: blurb, label: "Bundle description", widget: text }
          - name: concerns
            label: "Bundle concerns"
            widget: relation
            multiple: true
            required: false
            collection: _singletons
            file: products
            value_field: concerns.*.id
            display_fields: ["concerns.*.icon", "concerns.*.name"]
            search_fields: ["concerns.*.name"]
            hint: "Which concern filters list this gift set."
          - {
              name: id,
              label: "Bundle ID",
              widget: string,
              required: false,
              hint: "Leave blank on a new bundle. Never change it once the bundle is live."
            }

      # ==================================================================
      # 4. SHOP FAQ (Accordion Items)
      # ==================================================================
      - name: faq
        label: "FAQ"
        widget: list
        label_singular: Question
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.question}}"
        hint: "Questions and answers shown on the Shop and Contact pages."
        fields:
          - { name: question, label: Question, widget: string }
          - { name: answer, label: Answer, widget: text }

      # ==================================================================
      # 5. TECHNICAL & SHOP SETTINGS (Rare / Setup Items - Collapsed by Default)
      # ==================================================================
      - name: concerns
        label: "Concern filters"
        widget: list
        label_singular: Concern
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.icon}} {{fields.name}}"
        hint: "The shop's 'shop by concern' filters, e.g. Sleep & Relaxation, Sore Muscles. You rarely need to change these."
        fields:
          - { name: name, label: "Concern name", widget: string }
          - { name: icon, label: "Emoji", widget: string, required: false }
          - {
              name: id,
              label: "Concern ID",
              widget: string,
              required: false,
              hint: "Leave blank on a new one. Never change it once products use it."
            }

      - name: categories
        label: "Product categories"
        widget: list
        label_singular: Category
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.label}}"
        hint: >-
          The filter buttons across the top of the shop page. Just type
          the name — the behind-the-scenes code is created for you.
        fields:
          - {
              name: label,
              label: "Category name",
              widget: string,
              hint: "The filter button on the shop page."
            }
          - {
              name: id,
              label: "Category ID",
              widget: string,
              required: false,
              hint: "Leave blank on a new category. Never change it once products use it."
            }

  - name: events
    label: "2. Markets & Pop-Ups"
    icon: event
    description: "Your pop-up schedule: markets, fairs and Pride dates. Once a date passes the event moves itself to 'Where We've Been'. Save publishes in a few minutes."
    file: assets/data/events.json
    format: json
    # No side-by-side preview: for a settings/catalogue form it only re-lists
    # every field as label + value beside the field itself -- twice the
    # screen for the same information (2026-09-03). The Journal keeps its
    # preview, where rendered post text is actually useful.
    editor:
      preview: false
    fields:
      - name: upcoming
        label: "Upcoming pop-ups"
        widget: list
        label_singular: Event
        required: false
        collapsed: true
        summary: "{{fields.dateLabel}} — {{fields.name}} ({{fields.location}})"
        hint: "Confirmed dates only — customers may show up in person."
        fields:
          - { name: name, label: "Event name", widget: string, hint: "e.g. Landrum Farmers Market" }
          - {
              name: date,
              label: "Start date",
              widget: datetime,
              format: "YYYY-MM-DD",
              date_format: "MM/DD/YYYY",
              time_format: false,
              hint: "The first day for a multi-day event. Drives sorting and the countdown."
            }
          - {
              name: endDate,
              label: "End date",
              widget: datetime,
              format: "YYYY-MM-DD",
              date_format: "MM/DD/YYYY",
              time_format: false,
              required: false,
              hint: "Only for multi-day events: set the last day so it stays listed through the whole event."
            }
          - {
              name: dateLabel,
              label: "Date as shown on the page",
              widget: string,
              hint: "e.g. Sat, Sep 12, 2026 · 9am–2pm"
            }
          - { name: location, label: "Location", widget: string, hint: "e.g. Landrum, SC" }
          - {
              name: zip,
              label: "ZIP code",
              widget: string,
              required: false,
              pattern: ["^$|^[0-9]{5}$", "Enter a 5-digit ZIP code, or leave blank."],
              hint: "Needed if customers can pick up orders here: sales tax depends on where the order is received, and this ZIP is how the right amount is worked out. Leave blank and pickup orders use the customer's home address, which may be slightly off."
            }
          - {
              name: type,
              label: "Type",
              widget: string,
              hint: "e.g. Farmers Market, Fair, Pride Event"
            }
          - {
              name: emoji,
              label: "Emoji",
              widget: string,
              required: false,
              pattern: ["^$|^.{1,16}$", "One emoji only (or leave blank)."],
              hint: "One emoji, e.g. 🦇 or 🏳️‍🌈. Shown next to the NEXT upcoming event in the countdown ticker and banner."
            }
          - {
              name: url,
              label: "Link",
              widget: string,
              required: false,
              hint: "The event's own page or an info page."
            }
          - { name: note, label: "Note", widget: text, required: false }
          - {
              name: id,
              label: "Event ID",
              widget: string,
              required: false,
              hint: "Leave blank and it's made from the name. It's part of the event's page link, so don't change it once live."
            }
      - name: past
        label: "Past appearances"
        widget: list
        label_singular: Event
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.dateLabel}} — {{fields.name}} ({{fields.location}})"
        hint: "Shown under 'Where We've Been'. Upcoming events move here on their own once their date passes."
        fields:
          - { name: name, label: "Event name", widget: string }
          - {
              name: date,
              label: "Date",
              widget: datetime,
              format: "YYYY-MM-DD",
              date_format: "MM/DD/YYYY",
              time_format: false,
              required: false,
              hint: "Used for sorting."
            }
          - { name: dateLabel, label: "Date as shown", widget: string, hint: "e.g. June 2026" }
          - { name: location, label: "Location", widget: string, required: false }
          - { name: type, label: "Type", widget: string, required: false }
          - { name: url, label: "Link", widget: string, required: false }
          - { name: note, label: "Note", widget: text, required: false }
          - { name: id, label: "Event ID", widget: string, required: false }

  - name: reviews
    label: "3. Customer Reviews"
    icon: reviews
    description: "Reviews shown on your site. Only add real ones you've approved, and tick 'Feature on homepage?' for the few you want front and center. Kept separate from your Etsy star rating."
    file: assets/data/site-reviews.json
    format: json
    # No side-by-side preview: for a settings/catalogue form it only re-lists
    # every field as label + value beside the field itself -- twice the
    # screen for the same information (2026-09-03). The Journal keeps its
    # preview, where rendered post text is actually useful.
    editor:
      preview: false
    fields:
      - name: reviews
        label: "On-site reviews"
        widget: list
        label_singular: Review
        required: false
        collapsed: true
        summary: "{{fields.name}} — {{fields.rating}}★"
        hint: "Real, approved reviews only. These never merge into your Etsy star rating."
        fields:
          - {
              name: name,
              label: "Reviewer name",
              widget: string,
              hint: "Add '(Etsy)' after the name if it came from an Etsy review."
            }
          - {
              name: rating,
              label: "Rating (1–5)",
              widget: number,
              value_type: int,
              min: 1,
              max: 5
            }
          - {
              name: text,
              label: "Review text",
              widget: text,
              hint: "Keep it close to what they actually wrote."
            }
          # relation -> pick the product by name instead of typing its id.
          - name: productId
            label: "Product"
            widget: relation
            required: false
            collection: _singletons
            file: products
            value_field: products.*.id
            display_fields: ["products.*.name"]
            search_fields: ["products.*.name"]
            hint: "Leave blank for a whole-shop review."
          - {
              name: date,
              label: "Review date",
              widget: datetime,
              format: "YYYY-MM-DD",
              date_format: "MM/DD/YYYY",
              time_format: false,
              required: false
            }
          - {
              name: featured,
              label: "Feature on homepage?",
              widget: boolean,
              default: false,
              required: false,
              hint: "Shows this review in the homepage testimonials."
            }
          - {
              name: verifiedBuyer,
              label: "Verified buyer?",
              widget: boolean,
              default: true,
              required: false,
              hint: "Tick if they bought from you or were confirmed at a market."
            }
          - {
              name: orderRef,
              label: "Matched order reference",
              widget: string,
              required: false,
              hint: "The order or checkout reference this review was matched to. Filling it in shows the 'Verified buyer' badge on its own — leave both blank until you've matched the review to a real order."
            }
          - {
              name: ownerReply,
              label: "Reply from Savanna",
              widget: text,
              required: false,
              hint: "A short on-brand reply shown under the review — good for saying thanks, or for answering a lower rating."
            }
          # `id` exists on saved reviews -- declared so a CMS save
          # doesn't strip it. Auto-generated by the build if blank.
          - {
              name: id,
              label: "Review ID",
              widget: string,
              required: false,
              hint: "Leave blank — it's made for you."
            }

  - name: social_feed
    label: "5. Social Media Feed"
    icon: photo_camera
    description: "The photo strip on your homepage: a picture and caption for each Instagram or TikTok post you want to show off. Its on/off switch is under 6 → Site Settings."
    file: assets/data/social-feed.json
    format: json
    # No side-by-side preview: for a settings/catalogue form it only re-lists
    # every field as label + value beside the field itself -- twice the
    # screen for the same information (2026-09-03). The Journal keeps its
    # preview, where rendered post text is actually useful.
    editor:
      preview: false
    fields:
      - name: posts
        label: Posts
        widget: list
        label_singular: Post
        required: false
        collapsed: true
        summary: "{{fields.caption}}"
        fields:
          - { name: image, label: "Photo", widget: image }
          - { name: caption, label: "Caption", widget: text }
          - {
              name: author,
              label: "Author name",
              widget: string,
              required: false
            }
          - {
              name: handle,
              label: "Social handle",
