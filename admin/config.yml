# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Y'ALLTERNATIVE LIVING -- Sveltia CMS configuration
# ----------------------------------------------------------------------
# This is the editor Savanna uses at /admin instead of hand-editing JSON
# files in a text editor. It's split into four separate top-level
# sections in the /admin sidebar -- each its own collection below, on
# purpose, so Savanna sees exactly what she can do at a glance instead
# of hunting through one generic "catalog" menu:
#   1. Products, Bundles & FAQ  -- assets/data/products.json
#   2. Markets, Fairs & Pride Dates -- assets/data/events.json
#   3. Customer Reviews         -- assets/data/site-reviews.json
#   4. Page Wording             -- assets/data/content.json
# Full setup instructions (GitHub repo, Netlify OAuth, first login) are
# in DEVELOPMENT.md section 20 -- read that before changing anything here.
# For the click-by-click version of that same setup, see docs/SETUP-GUIDE.md
# Step 2C.
#
# backend.repo below now points at the real repo:
# github.com/yallternative-living/yallternative-living. What's still needed
# before /admin actually logs in: (1) this repo deployed on Netlify or
# GitHub Pages, (2) GitHub OAuth turned on for that deploy (one Netlify
# checkbox, or a small auth helper for Pages) -- see DEVELOPMENT.md section 20.
#
# Every field below maps 1:1 to a real field already used in
# assets/data/products.json -- nothing here was invented; if a field
# isn't listed, it isn't part of the real catalog schema. After saving
# a change here, Sveltia commits straight to the repo, and the site's
# own deploy step re-runs `node scripts/build-site-data.js` to
# regenerate everything derived from it (see netlify.toml / vercel.json
# / .github/workflows/deploy-pages.yml) -- Savanna does NOT need to run
# that script by hand.

backend:
  name: github
  # Must match the repo the site actually pushes to -- `git remote -v`
  # says github.com/yallternative-living/yallternative-living (the old
  # StevenMGlenn/yallternative-living value here pointed at a repo that
  # doesn't exist anymore, which would make every /admin login fail).
  repo: yallternative-living/yallternative-living
  branch: main
  # No `base_url` set here on purpose -- when this site is deployed on
  # Netlify, Netlify itself is Sveltia's default OAuth provider for the
  # github backend with ZERO extra config here (verified directly
  # against sveltiacms.app/en/docs/backends/github, "Using Netlify"
  # section). The one-time setup happens in the Netlify dashboard, not
  # in this file -- see DEVELOPMENT.md section 20.

site_url: https://yallternativeliving.com
display_url: https://yallternativeliving.com
logo_url: /assets/img/logo.png

# media_folder = where uploads are stored in the repo; public_folder = the path
# written into products.json for each uploaded image. Both are /assets/img.
# (The build's JSON-LD image URLs normalize a leading slash -- see the
# .replace(/^\/+/, "") in scripts/build-site-data.js -- so a CMS-uploaded
# "/assets/img/x.jpg" can't produce a double-slash "domain.com//assets/img" URL,
# even though existing hand-entered paths are relative "assets/img/x.jpg".)
media_folder: /assets/img
public_folder: /assets/img

collections:
  - name: products
    label: "1. Products, Bundles & FAQ"
    files:
      - name: products
        label: Products, Bundles & FAQ
        file: assets/data/products.json
        format: json
        fields:
          - name: shop
            label: Shop Info (shown in JSON-LD + llms.txt -- keep accurate)
            widget: object
            collapsed: true
            fields:
              - { name: name, label: Shop Name, widget: string }
              - { name: etsyShopUrl, label: Etsy Shop URL, widget: string }
              - { name: rating, label: "Etsy Rating (0-5, real number only)", widget: number, value_type: float }
              - { name: reviewCount, label: "Etsy Review Count (real number only)", widget: number, value_type: int }
              - { name: sales, label: "Etsy Sales Count (real number only)", widget: number, value_type: int }
              - { name: freeShippingThreshold, label: "Free Shipping Threshold (USD)", widget: number, value_type: int, hint: "Orders at or above this amount get free shipping. Set to 0 to disable." }
              - name: customBox
                label: "Build-Your-Own Box"
                widget: object
                required: false
                collapsed: true
                hint: "Settings for the pick-your-own bundle on the shop page. The box price is always worked out from the real prices of whatever the shopper picks, minus the discount below."
                fields:
                  - { name: minItems, label: "Minimum items in a box", widget: number, value_type: int, default: 3 }
                  - { name: maxItems, label: "Maximum items in a box", widget: number, value_type: int, default: 5 }
                  - { name: discountPercent, label: "Discount (%)", widget: number, value_type: int, default: 10, hint: "Percent off the combined price of the chosen items." }
                  - name: eligibleCategories
                    label: "Categories shoppers can pick from"
                    widget: list
                    default: ["salves", "body", "soaks", "potions", "ritual"]
                    hint: "Category codes, e.g. salves, body, soaks, potions, ritual. Apparel and gift cards are usually left out."

          - name: sales
            label: Category Sales
            widget: list
            label_singular: Sale
            collapsed: true
            summary: "{{fields.label}}"
            hint: "Example: { 'category': 'body', 'percentOff': 15, 'label': 'Body Care Sale' }"
            fields:
              - { name: category, label: Category ID, widget: string }
              - { name: percentOff, label: Percent Off, widget: number, value_type: int }
              - { name: label, label: Sale Label, widget: string }

          - name: categories
            label: Categories
            widget: list
            label_singular: Category
            summary: "{{fields.label}}"
            hint: >-
              These power the shop page's filter pills. Adding a category label
              here automatically generates its ID for filter matching.
            fields:
              - { name: label, label: "Label (shown on the filter pill)", widget: string }

          - name: products
            label: Products
            widget: list
            label_singular: Product
            summary: "{{fields.name}} — ${{fields.price}} ({{fields.category}})"
            fields:
              # `id` and `description` exist in products.json but were not
              # declared here -- a CMS save writes only declared fields, so
              # both would have been silently stripped from the file the
              # first time Savanna hit Save. `id` is also the Snipcart
              # product ID and the wishlist/review/bundle reference key, so
              # it must never change once a product has been sold.
              - name: id
                label: "Product ID (advanced -- leave blank for new products, NEVER change on existing ones)"
                widget: string
                required: false
                hint: >-
                  Auto-generated from the product name by the build if left
                  blank. Once a product is live this ID is what Snipcart,
                  bundles, reviews, and customer wishlists point at --
                  changing it breaks all of those, so don't.
              - { name: name, label: "Product Name (shown everywhere on the site)", widget: string }
              - name: description
                label: "SEO / Share Description (used for the product page's meta description and link previews)"
                widget: text
                required: false
                hint: "Falls back to the shop-card description below if left blank."
              - name: featured
                label: Featured Product
                widget: boolean
                default: false
                required: false
                hint: "Check this box to feature this product on the homepage grid."
              - name: bestseller
                label: Bestseller Product
                widget: boolean
                default: false
                required: false
                hint: "Check this box to highlight this item with a 'Bestseller' badge in the catalog."
              - name: comingSoon
                label: Coming Soon Product
                widget: boolean
                default: false
                required: false
                hint: "Check this box to show a 'Coming Soon' badge and hide the purchase options."
              - name: category
                label: Category
                widget: select
                options:
                  - { label: "Apparel", value: "apparel" }
                  - { label: "Salves & Balms", value: "salves" }
                  - { label: "Body & Skin", value: "body" }
                  - { label: "Soaks", value: "soaks" }
                  - { label: "Potions & Spellwork", value: "potions" }
                  - { label: "Ritual & Home", value: "ritual" }
                  - { label: "Gift Cards", value: "gift-cards" }
                hint: Choose the shop category this product belongs to.
              - { name: price, label: "Price (USD, e.g. 16 or 16.50)", widget: number, value_type: float, min: 0, step: 0.01 }
              - name: sale
                label: "Sale (Optional per-product sale)"
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: price, label: Sale Price, widget: number, value_type: float }
                  - { name: label, label: Sale Label, widget: string }
              - { name: originalPrice, label: "Original Price (if on sale, usually auto-computed)", widget: number, value_type: float, required: false }
              - name: image
                label: Main Photo
                widget: image
                hint: The hero photo shown on the product card and in the gallery's first slot.
              - name: images
                label: "Extra Gallery Photos (optional)"
                widget: list
                label_singular: Photo
                required: false
                # The subfield needs a `name` -- without it this field fails
                # Sveltia's config schema and the photo list won't render.
                field: { name: photo, label: Photo, widget: image }
              - name: blurb
                label: "Description (real, honest copy -- see DEVELOPMENT.md section 1 for the brand voice/what NOT to claim)"
                widget: text
              - name: etsyUrl
                label: "Real Etsy Listing URL (optional)"
                widget: string
                required: false
                hint: "Etsy listing URL -- optional (e.g. leave blank for digital gift cards or site-only items)."
              - name: rating
                label: "Etsy Rating for THIS product (optional -- leave blank unless this exact listing has its own real reviews)"
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: value, label: "Rating (0-5, real number from this listing's own Etsy page)", widget: number, value_type: float }
                  - { name: count, label: "Review Count (real number from this listing's own Etsy page)", widget: number, value_type: int }
              - name: stock
                label: "Stock Count (leave blank for unlimited stock)"
                widget: number
                value_type: int
                min: 0
                required: false
                hint: >-
                  Leave blank for unlimited/made-to-order stock.
                  Set to 0 to show "Sold Out" and disable checkout.
                  Set to a number 1-5 to show a warning badge (e.g. "Only 3 left").
                  (Note: This is manually updated and does not auto-sync with Etsy).
              # NOTE: no label_singular here -- a plain string list (no
              # subfields) doesn't accept it per Sveltia's config schema.
              - name: ingredients
                label: "Ingredients / Materials list (optional)"
                widget: list
                required: false
                hint: >-
                  Source this from the product's OWN Etsy listing
                  description -- not the generic "Materials" tag field,
                  which has been found to be copy-pasted boilerplate
                  across unrelated listings. Never invent an ingredient.
              - name: ingredientsLabel
                label: "Ingredients Section Label (optional -- defaults to \"Ingredients\")"
                widget: string
                required: false
                hint: Use something like "Materials" for non-body-care items (e.g. the keychain).
              - name: ingredientsNote
                label: "Ingredients Caveat (optional, e.g. \"No essential oils, no added fragrance.\")"
                widget: string
                required: false
              - name: scent
                label: "Scent Profile (optional)"
                widget: string
                required: false
                hint: "One short scent name, e.g. Lavender, Bourbon Vanilla, Frankincense, or Unscented. Products sharing a name get grouped together in the shop's scent filter. Leave blank if it doesn't apply."
              - name: variants
                label: "Size/Scent/Blend Variants (optional -- leave blank for a single-option product)"
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: name, label: "Variant Type Label (e.g. \"Size\" or \"Scent\")", widget: string }
                  - name: options
                    label: Options
                    widget: list
                    label_singular: Option
                    summary: "{{fields.label}} ({{fields.priceDelta}})"
                    hint: >-
                      At least one option must have priceDelta 0 (the
                      base price above). A real Etsy listing's own
                      variant price differences go in priceDelta, not a
                      guess -- verify against the actual listing.
                    fields:
                      - name: label
                        label: "Option Label (e.g. \"8 oz\" or \"Lavender\")"
                        widget: string
                        hint: Cannot contain [ ] or | characters -- these break the cart's option-parsing syntax (see assets/js/cart.js).
                      - { name: priceDelta, label: "Price Difference From Base Price (0 if same price, negative allowed)", widget: number, value_type: float, default: 0 }
              - name: tags
                label: Tags (Sensitivity / Allergen)
                widget: select
                multiple: true
                required: false
                options:
                  - { label: "Vegan", value: "vegan" }
                  - { label: "Unscented", value: "unscented" }
                  - { label: "Essential Oil Free", value: "essential-oil-free" }
                  - { label: "Sensitive Skin Safe", value: "sensitive-safe" }
                  - { label: "Cruelty-Free", value: "cruelty-free" }
                  - { label: "Organic Ingredients", value: "organic" }
                  - { label: "Locally Sourced / Foraged", value: "locally-sourced" }
              - name: inStock
                label: In Stock
                widget: boolean
                default: true
                required: false
                hint: "Uncheck to show a 'Sold Out' badge and email notification form instead of Add to Cart."

          - name: bundles
            label: Bundles / Gift Sets
            widget: list
            label_singular: Bundle
            summary: "{{fields.name}} — {{fields.discountPercent}}% off"
            required: false
            hint: >-
              The bundle's actual selling price is ALWAYS computed at
              build time from the real current prices of the products
              listed below plus this discount -- never hand-set a price
              here, there's nowhere to put one.
            fields:
              # Same as products: `id` exists in the data file, so it must be
              # declared here or a CMS save strips it (it's the Snipcart ID
              # and wishlist key for the bundle).
              - { name: id, label: "Bundle ID (advanced -- leave blank for new bundles, never change on existing ones)", widget: string, required: false }
              - { name: name, label: "Bundle Name", widget: string }
              - name: productIds
                label: "Product IDs In This Bundle (2 or more)"
                widget: list
                label_singular: Product ID
                hint: >-
                  Type the exact "id" value of each real product to
                  include (see each product's own ID field above) --
                  this is plain text, not a picker, so double-check
                  spelling against the Products list.
                field: { name: productId, label: Product ID, widget: string }
              - { name: discountPercent, label: "Discount Percent (0-90, e.g. 10 for 10% off)", widget: number, value_type: int, min: 0, max: 90 }
              - { name: blurb, label: Bundle Description, widget: text }

          - name: faq
            label: "FAQ (the site's ONE FAQ -- shown on contact.html and linked from shop.html, see DEVELOPMENT.md section 17)"
            widget: list
            label_singular: Question
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Question, widget: string }
              - { name: answer, label: Answer, widget: text }

  - name: events
    label: "2. Markets, Fairs & Pride Dates"
    files:
      - name: events
        label: Markets, Fairs & Pride Dates
        file: assets/data/events.json
        format: json
        fields:
          - name: upcoming
            label: "Upcoming pop-ups (confirmed dates only -- customers may show up in person!)"
            widget: list
            label_singular: Event
            required: false
            summary: "{{fields.dateLabel}} — {{fields.name}} ({{fields.location}})"
            fields:
              - { name: date, label: "Event Date (start)", widget: datetime, format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false, hint: "The event's date (or the FIRST day for a multi-day event). Drives sorting and the countdown to opening." }
              - { name: endDate, label: "End Date (only for multi-day events)", widget: datetime, format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false, required: false, hint: "Leave blank for single-day events. For a two-day market, set this to the LAST day so it stays listed through the whole event." }
              - { name: dateLabel, label: "Date shown on the page (e.g. \"Sat, Sep 12, 2026 · 9am-2pm\")", widget: string }
              - { name: name, label: "Event Name (e.g. Landrum Farmers Market)", widget: string }
              - { name: type, label: "Type (e.g. Farmers Market, Fair, Pride Event)", widget: string }
              - { name: location, label: "Location (e.g. Landrum, SC)", widget: string }
              - { name: zip, label: "ZIP code of the market (optional)", widget: string, required: false, pattern: ['^$|^[0-9]{5}$', "Enter a 5-digit ZIP code, or leave blank."], hint: "Only matters if you let customers pick up orders here. Sales tax is charged based on where the customer actually receives their order, and each county charges a little differently -- this ZIP is how the right amount gets worked out. Leave blank and pickup orders use the customer's home address instead, which may be slightly off." }
              - { name: url, label: "Link (optional -- event or info page)", widget: string, required: false }
              - { name: note, label: "Note (optional)", widget: text, required: false }
          - name: past
            label: "Past appearances (optional -- shown under \"Where We've Been\")"
            widget: list
            label_singular: Event
            required: false
            summary: "{{fields.dateLabel}} — {{fields.name}} ({{fields.location}})"
            fields:
              # Past events in events.json also carry a `date` -- declared
              # here so a CMS save doesn't strip it from existing entries.
              - { name: date, label: "Event Date (optional -- used for sorting)", widget: datetime, format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false, required: false }
              - { name: dateLabel, label: "Date shown (e.g. \"June 2026\")", widget: string }
              - { name: name, label: "Event Name", widget: string }
              - { name: type, label: "Type (optional)", widget: string, required: false }
              - { name: location, label: "Location (optional)", widget: string, required: false }
              - { name: url, label: "Link (optional)", widget: string, required: false }
              - { name: note, label: "Note (optional)", widget: text, required: false }

  - name: reviews
    label: "3. Customer Reviews"
    files:
      - name: reviews
        label: Customer Reviews (on-site)
        file: assets/data/site-reviews.json
        format: json
        fields:
          - name: reviews
            label: "On-site reviews (only add REAL ones you've approved -- kept separate from your Etsy star rating, never merged into it)"
            widget: list
            label_singular: Review
            required: false
            summary: "{{fields.name}} — {{fields.rating}}★"
            fields:
              # `id` exists on saved reviews -- declared so a CMS save
              # doesn't strip it. Auto-generated by the build if blank.
              - { name: id, label: "Review ID (leave blank -- auto-generated)", widget: string, required: false }
              - { name: name, label: "Reviewer name/handle (add \"(Etsy)\" if it's from an Etsy review)", widget: string }
              - { name: rating, label: "Rating (1-5)", widget: number, value_type: int, min: 1, max: 5 }
              - { name: text, label: "Review text (keep it close to what they actually wrote)", widget: text }
              - name: productId
                label: "Which product? (optional)"
                widget: string
                required: false
                hint: "A product's ID (e.g. sleep-salve), or leave blank for a general/whole-shop review."
              - { name: date, label: "Publish Date", widget: datetime, format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false, required: false, hint: "Select the date the review was written/published." }
              - { name: featured, label: "Feature on homepage?", widget: boolean, default: false, required: false, hint: "Check this to highlight this review on the homepage testimonials grid." }

  - name: journal
    label: "4. Apothecary Journal (Blog)"
    files:
      - name: journal
        label: Apothecary Journal
        file: assets/data/journal.json
        format: json
        fields:
          - name: title
            label: "Journal Page Title (e.g. Apothecary Journal)"
            widget: string
          - name: lede
            label: "Journal Page Subheading (e.g. Stories, science, and small-batch updates...)"
            widget: text
          - name: posts
            label: Journal Posts
            widget: list
            label_singular: Post
            required: false
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - { name: id, label: "Post ID (leave blank -- auto-generated from the title)", widget: string, required: false }
              - { name: title, label: "Title", widget: string }
              - { name: date, label: "Publish Date", widget: datetime, format: "YYYY-MM-DD", date_format: "MM/DD/YYYY", time_format: false }
              - { name: image, label: "Featured Image", widget: image, required: false }
              - { name: excerpt, label: "Excerpt (short text shown in list)", widget: text }
              - { name: content, label: "Content (full post text)", widget: text }

  - name: social_feed
    label: "5. Social Media Feed"
    files:
      - name: social_feed
        label: Social Media Feed
        file: assets/data/social-feed.json
        format: json
        fields:
          - name: posts
            label: Social Feed Posts
            widget: list
            label_singular: Social Post
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { name: id, label: "Post ID (leave blank -- auto-generated)", widget: string, required: false }
              - { name: image, label: "Post Image", widget: image }
              - { name: caption, label: "Caption", widget: text }
              - { name: author, label: "Author Name / Handle (optional)", widget: string, required: false }
              - { name: handle, label: "Social Handle (e.g. @user, optional)", widget: string, required: false }
              - { name: productId, label: "Tagged Product ID (optional)", widget: string, required: false }
              - { name: productName, label: "Tagged Product Name (optional)", widget: string, required: false }
              - { name: url, label: "Original Post Link (optional)", widget: string, required: false }

  - name: content
    label: "6. Site Images & Page Wording"
    files:
      - name: content
        label: Site Images & Page Content
        file: assets/data/content.json
        format: json
        fields:
          - name: site
            label: "⚙️ Site Settings, Branding & Integrations"
            widget: object
            collapsed: true
            fields:
              - { name: logoDesktop, label: "Desktop Logo Image (Header & Footer)", widget: image, hint: "Main brand logo image shown in the website header and footer on desktop screens." }
              - { name: logoMobile, label: "Mobile Logo Image (Navigation)", widget: image, hint: "Brand logo image shown in the mobile navigation menu drawer." }
              - { name: ogImage, label: "Social Share / Link Preview Image (OG Image)", widget: image, hint: "Preview image shown when sharing site links on Facebook, text messages, iMessage, Twitter, etc." }
              - { name: footerTagline, label: "Footer Message", widget: text, required: false }
              - { name: newsletterTitle, label: "Newsletter Headline", widget: string, required: false }
              - { name: newsletterSubtext, label: "Newsletter Description", widget: text, required: false }
              - { name: kitFormAction, label: "Newsletter Form Link (Kit/ConvertKit)", widget: string, required: false, hint: "Paste the form link from your Kit account here." }
              - { name: tawkToPropertyId, label: "Live Chat Property Code (Tawk.to)", widget: string, required: false, hint: "Optional live chat support ID." }
              - { name: tawkToWidgetId, label: "Live Chat Widget Code (Tawk.to)", widget: string, required: false, hint: "Optional live chat widget ID." }
              - { name: formspreeContactId, label: "Contact Form Code (Formspree)", widget: string, required: false, hint: "Your Formspree code for messages sent from the Contact page." }
              - { name: formspreeReviewId, label: "Customer Reviews Form Code (Formspree)", widget: string, required: false, hint: "Your Formspree code for customer review submissions." }
              - { name: formspreeRestockId, label: "Launch Alert Signup Code (Formspree)", widget: string, required: false, hint: "Your Formspree code for 'email me when it launches' signups." }
              # Hidden on purpose (widget: hidden = stored, but no UI control).
              # Gift Up! is only half-built: setting a real ID generates a
              # working Gift Up! widget, but nothing hides the built-in
              # gift-card button, so both would render at once. The field
              # stays declared so the CMS round-trips the value instead of
              # dropping it on save -- unhide it (widget: string) only after
              # the bypass in main.js exists. See DEVELOPMENT.md section 18.
              - { name: giftUpId, label: "Gift Card Account Code (Gift Up!)", widget: hidden, required: false }
              - { name: umamiWebsiteId, label: "Website Analytics Code (Umami - Optional)", widget: string, required: false, hint: "Optional code for cookieless website visitor tracking." }
              - { name: enableJournal, label: "Show Apothecary Journal (Blog)", widget: boolean, default: false, required: false, hint: "Show or hide the blog page." }
              - { name: enableSocialFeed, label: "Show Social Media Feed", widget: boolean, default: false, required: false, hint: "Show or hide the Instagram/TikTok social feed on the homepage." }
              - { name: enableRestockAlerts, label: "Show 'Email Me When It Launches' Signup", widget: boolean, default: true, required: false, hint: "Adds an email signup to any product marked Coming Soon, so shoppers can be told when it lands." }
              - { name: enableCustomBoxBuilder, label: "Show Build-Your-Own Box", widget: boolean, default: true, required: false, hint: "Let shoppers pick their own mix of goods for a discounted bundle. Sizes and discount are set under Shop Settings." }
              - { name: enableScentFilter, label: "Show Scent Filter", widget: boolean, default: true, required: false, hint: "Adds scent buttons to the shop filters. Only appears once at least two products have a Scent set on them." }
              - { name: enableIngredientsModal, label: "Show Botanical Ingredients Info", widget: boolean, default: true, required: false, hint: "Show the interactive ingredients list on product cards." }
              - { name: enableLocalPickup, label: "Show Free Local Market Pick-up", widget: boolean, default: true, required: false, hint: "Offer a free local pop-up market pickup option in the cart." }
              - { name: enableCountdownTicker, label: "Show Event Countdown Ticker", widget: boolean, default: true, required: false, hint: "Display the countdown timer for your next upcoming market or pop-up." }
              - { name: enableOrderStatusLookup, label: "Show Order Lookup Tool", widget: boolean, default: true, required: false, hint: "Let customers check order progress and shipping status." }
