              label: "Original post link",
              widget: string,
              required: false
            }
          - {
              name: id,
              label: "Post ID",
              widget: string,
              required: false,
              hint: "Leave blank — it's made for you."
            }

  - name: content
    label: "6. ⚙️ Site Settings"
    icon: tune
    description: "Wording and photos across your pages (homepage, About, Contact, logos) plus the on/off switches for site features. Open a section, edit, Save. Start with 'Site Settings'."
    file: assets/data/content.json
    format: json
    # No side-by-side preview: for a settings/catalogue form it only re-lists
    # every field as label + value beside the field itself -- twice the
    # screen for the same information (2026-09-03). The Journal keeps its
    # preview, where rendered post text is actually useful.
    editor:
      preview: false
    fields:
      # Everyday items first (logos, banners, footer/newsletter wording,
      # social links, feature switches), then the emails the shop sends,
      # then the paste-once connection codes at the very bottom. Order only
      # affects the editor, not the site.
      - name: site
        label: "⚙️ Site Settings & Switches"
        widget: object
        # Open by default: this is the block Savanna comes here for, and a
        # collapsed Sveltia object reads like a text field showing one value
        # rather than a drawer (2026-09-03).
        collapsed: false
        summary: "▸ Click the arrow to open -- on/off switches first, then banners, logos and connection codes"
        hint: "The on/off switches for site features come first. Below them: banners, logos, newsletter wording, social links, and the connection codes for your newsletter, forms, chat and stats -- those are set once and rarely touched."
        fields:
          # Switches first: this is the part of the form Savanna opens most
          # often and used to be ~200 lines down, under the logos, banners,
          # newsletter copy and social links. Everything below the switches
          # is set once and rarely touched again.
          # --- Feature switches -----------------------------------------
          # Sveltia cannot draw sub-headings inside an object, so the group
          # rides in the label ("Shop ·", "Site ·", "Emails to me ·") and the
          # list is ordered by group. The email switches proper follow under
          # "Emails the shop sends on its own".

          - {
              name: enableApothecaryQuiz,
              label: "Shop · Show the product quiz",
              widget: boolean,
              default: true,
              required: false,
              hint: "The recommendation quiz on the shop page (section 7)."
            }
          - {
              name: enableCustomBoxBuilder,
              label: "Shop · Show Build-Your-Own Box",
              widget: boolean,
              default: true,
              required: false,
              hint: "Shoppers pick their own mix for a discounted bundle. Sizes and discount are under 1 → Shop settings."
            }
          - {
              name: enableScentFilter,
              label: "Shop · Show scent filter",
              widget: boolean,
              default: true,
              required: false,
              hint: "Adds scent buttons to the shop filters once at least two products have a Scent set."
            }
          - {
              name: enableIngredientsModal,
              label: "Shop · Show ingredients info",
              widget: boolean,
              default: true,
              required: false,
              hint: "The clickable ingredients list on product cards."
            }
          - {
              name: enableLocalPickup,
              label: "Shop · Show free local pick-up",
              widget: boolean,
              default: true,
              required: false,
              hint: "Offers free pick-up at a pop-up market as a cart option."
            }
          - {
              name: enableRestockAlerts,
              label: "Shop · Show launch-alert sign-up",
              widget: boolean,
              default: true,
              required: false,
              hint: "Adds an 'email me when it launches' sign-up to Coming Soon products."
            }
          - {
              name: enableLoyaltyPoints,
              label: "Shop · Show Customer Rewards Points",
              widget: boolean,
              default: true,
              required: false,
              hint: "Shows earned points on price tags and in the cart."
            }
          # Hidden on purpose: naming/rate constants for the rewards program, set once
          # and not part of Savanna's everyday editing (enableLoyaltyPoints above is
          # her on/off switch). widget: hidden keeps default seeding a first deploy but
          # drops the UI control; the current value still round-trips on every save.
          - {
              name: loyaltyPointsName,
              label: "Shop · Rewards points name (plural)",
              widget: hidden,
              default: "Alt-Points",
              required: false
            }
          - {
              name: loyaltyPointsSingular,
              label: "Shop · Rewards points name (singular)",
              widget: hidden,
              default: "Alt-Point",
              required: false
            }
          - {
              name: loyaltyPointsPerDollar,
              label: "Shop · Points per $1 spent",
              widget: hidden,
              default: 1,
              required: false
            }
          - {
              name: loyaltyBadgeEmoji,
              label: "Shop · Rewards emoji",
              widget: hidden,
              default: "✨",
              required: false
            }


          - {
              name: enableOrderStatusLookup,
              label: "Shop · Show Order Lookup Tool",
              widget: boolean,
              default: true,
              required: false,
              hint: "Lets customers check order progress and shipping status."
            }
          - {
              name: enableLiveChat,
              label: "Site · Show live chat (Tawk.to)",
              widget: boolean,
              default: true,
              required: false,
              hint: "The chat bubble in the bottom corner of every page. Off hides it everywhere; your Tawk.to IDs stay saved for when you turn it back on."
            }
          - {
              name: enableJournal,
              label: "Site · Show the Journal (blog)",
              widget: boolean,
              default: false,
              required: false,
              hint: "Shows the blog page and its menu link (section 4)."
            }
          - {
              name: enableSocialFeed,
              label: "Site · Show social media feed",
              widget: boolean,
              default: false,
              required: false,
              hint: "The Instagram/TikTok strip on the homepage (section 5)."
            }
          - {
              name: enableCountdownTicker,
              label: "Site · Show event countdown ticker",
              widget: boolean,
              default: true,
              required: false,
              hint: "Counts down to your next market or pop-up."
            }
          - {
              name: enableDispatchCountdown,
              label: "Site · Show 'order by' shipping countdown",
              widget: boolean,
              default: false,
              required: false,
              hint: "Shows 'Order within 2h 10m to ship today' on cards, product pages and the cart, counting down to the cutoff below. Turn it on only if you can keep that promise every business day."
            }
          # Hidden on purpose: a set-once pair Steven configures, not something Savanna
          # tunes day to day (the "order by" countdown switch above is her control).
          # widget: hidden drops the object's own UI but keeps cutoffHour/cutoffMinute
          # in content.json untouched on every save -- proven against the pinned CMS
          # build (0.172.4) with a source read of Sveltia's save/serialize.js plus a
          # scripted save against a scratch copy of this config; see DEVELOPMENT.md
          # section 18b.
          - name: dispatch
            label: "Site · Shipping cutoff"
            widget: hidden
            required: false
          - {
              name: enableEventJsonLd,
              label: "Site · List markets in Google event search",
              widget: boolean,
              default: true,
              required: false,
              hint: "Gives Google what it needs to show your upcoming markets in its event results. No guarantee, and safe to leave on."
            }
          - {
              name: enableOrderEmails,
              label: "Emails to me · Email me each order as it's paid",
              widget: boolean,
              default: true,
              required: false,
              hint: "One fulfilment email per paid order, with the items, gift note and address."
            }          # --- Emails the shop sends on its own -------------------------
          - {
              name: enableLowStockAlerts,
              label: "Emails to me · Email me when stock runs low",
              widget: boolean,
              default: true,
              required: false,
              hint: "A daily note listing every product at or under the low-stock number in Automation settings."
            }
          - {
              name: enableOrderDigest,
              label: "Emails to me · Email me a daily order digest",
              widget: boolean,
              default: true,
              required: false,
              hint: "Each morning: every order from the last day with pick lists, sizes, gift notes to print and pickup markets."
            }
          - {
              name: enableMarketReminders,
              label: "Emails to me · Remind subscribers before a market",
              widget: boolean,
              default: true,
              required: false,
              hint: "One email the day before each market to people who signed up on the Events page."
            }
          - {
              name: enableReactionExport,
              label: "Emails to me · Email me monthly reaction reports",
              widget: boolean,
              default: true,
              required: false,
              hint: "On the 1st, a spreadsheet of last month's Report a Reaction submissions, for the MoCRA file."
            }
          # Hidden on purpose: thresholds and opening lines for the automation emails
          # above are set once by Steven, not tuned here day to day. Converting the
          # object's widget from object to hidden drops its six subfields from the
          # form; the CMS has no per-key view of a hidden object's contents, so it
          # writes the whole stored object back unchanged rather than field-by-field --
          # proven empirically (see the risk note in DEVELOPMENT.md section 18b).
          - name: automations
            label: "Automation settings"
            widget: hidden
            required: false

          # Hidden on purpose: copy fallback text, set once, not a Savanna control.
          - name: ritualDefaults
            label: "🌿 Complete the Ritual defaults"
            widget: object
            collapsed: true
            hint: "Used on any product that doesn't have its own ritual headline."
            fields:
              - {
                  name: title,
                  label: "Default headline",
                  widget: string,
                  default: "Botanical Pairing"
                }
              - {
                  name: subtitle,
                  label: "Default subtitle",
                  widget: text,
                  default: "Pair this item with complementary botanicals crafted to work together."
                }

          # --- Branding -------------------------------------------------
          - {
              name: logoDesktop,
              label: "Desktop logo",
              widget: image,
              hint: "Shown in the header and footer on desktop screens."
            }
          - {
              name: logoMobile,
              label: "Mobile logo",
              widget: image,
              hint: "Shown in the menu drawer on phones."
            }
          - {
              name: ogImage,
              label: "Link preview image",
              widget: image,
