# Netlify config for this static site. A real build command now runs
# before every deploy (see [build] below) -- it used to be truly zero-
# build, but the Sveltia CMS at /admin (DEVELOPMENT.md section 20) commits
# straight to assets/data/products.json, and that needs to be turned
# back into products-data.js/shop.html/contact.html/sitemap.xml/
# llms.txt on every deploy, not just when a human remembers to run
# scripts/build-site-data.js by hand.
#
# Auto-generated by scripts/build-security-headers.js -- don't hand-edit the
# [[headers]] for = "/*" block below, it'll just get overwritten and could
# drift out of sync with _headers/vercel.json again. Edit the csp/otherHeaders
# arrays in that script instead, then re-run it.

[build]
  publish = "."
  command = "node scripts/optimize-images.js && node scripts/build-site-data.js && node scripts/build-security-headers.js"

# The build needs devDependencies -- scripts/optimize-images.js requires
# "sharp" to generate each new photo's AVIF/WebP variants. Netlify installs
# devDependencies by default, but setting NODE_ENV=production (easy to do in
# the UI, and a common habit) silently makes npm skip them. Ask for them
# explicitly so that can't happen. optimize-images.js also degrades to a
# warning if sharp is missing anyway, so a mistake here costs unoptimized
# photos rather than a failed deploy.
#
# The Node version for this build is pinned in .nvmrc (Netlify reads that
# ahead of every other source), not here -- one source of truth.
[build.environment]
  NPM_FLAGS = "--include=dev"

# The Netlify Functions this site used to run are gone -- the money path
# is one Cloudflare Worker now (workers/checkout.js), reached via the
# /api/* proxy below. Generated by scripts/build-security-headers.js.

# Every /api/* route is answered by the Cloudflare Worker. `:splat` is the
# matched remainder, so /api/order-status reaches the Worker as
# /order-status -- workers/checkout.js's routeOf() accepts both spellings.
# The cart posts to /api/checkout; assets/js/cart.js's CHECKOUT_URL must agree.
[[redirects]]
  from = "/api/*"
  to = "https://yallternative-checkout.y-allternative-living.workers.dev/:splat"
  status = 200
  force = true

# Source, docs and tooling are in the publish root but must never be
# served. /admin/ is deliberately not in this list -- the CMS is served.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/workers/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cms-auth/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PROJECT.md"
  to = "/404.html"
