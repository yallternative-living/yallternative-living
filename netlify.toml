# Clean URL for the safety page. This path is PRINTED ON THE PACKAGING
# (MoCRA adverse-event contact), so it must resolve forever. status=200 is
# a rewrite: /safety and /safety.html both serve safety.html.
[[redirects]]
  from = "/safety"
  to = "/safety.html"
  status = 200

# The error page itself answers 404, not 200 -- it was fetchable at 200
# under both spellings, which reads as a soft 404 to a crawler.
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 404
  force = true

# Every page was reachable at TWO live URLs (/shop and /shop.html, both
# 200) while the canonical named only one and every internal link pointed
# at the other. The extensionless spelling now 301s to the canonical .html.
# force = true because Netlify's core routing resolves /shop to shop.html
# on its own -- that is not the Pretty URLs feature and has no toggle, so
# an unforced rule would lose to the content Netlify already found there.
