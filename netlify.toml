# Netlify config for this static site. A real build command now runs
# before every deploy (see [build] below) -- it used to be truly zero-
# build, but the Sveltia CMS at /admin (DEVELOPMENT.md section 20) commits
# straight to assets/data/products.json, and that needs to be turned
# back into products-data.js/shop.html/contact.html/sitemap.xml/
# llms.txt on every deploy, not just when a human remembers to run
# scripts/build-site-data.js by hand.
#
# Auto-generated by scripts/build-security-headers.js -- don't hand-edit the
# [[headers]] for = "/*" block below, it'll just get overwritten and could
# drift out of sync with _headers/vercel.json again. Edit the csp/otherHeaders
# arrays in that script instead, then re-run it.

[build]
  publish = "."
  command = "node scripts/build-site-data.js && node scripts/build-security-headers.js"

# Long-lived caching for hashed/never-changing assets. Pages themselves
# (index.html, shop.html, etc.) intentionally aren't cached long here --
# Netlify already serves them with an ETag + must-revalidate by default,
# so browsers re-check on every visit and always get the latest deploy.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Baseline security headers on every page -- identical policy to
# _headers and vercel.json (see this script's csp/otherHeaders).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cloud.umami.is https://embed.tawk.to https://translate.google.com https://translate.googleapis.com 'inline-speculation-rules' 'sha256-gUmq6gOoZ76O8R+C9JLLJzm46Aj4WygKv4n1nBxUfUk=' 'sha256-0kqeFm4bqiT8bQvy1ltLsg9sxxjyyPTni1L+4ARp8us=' 'sha256-Wmlc/Lumj50wOdax6AEbaQv0zXK/9D0NZCQxPTdXDqM=' 'sha256-YsU29e3LVxUDg51RFYP+WGWfImaLKfQjZhm15wjBG1U=' 'sha256-VJ7jNsHEHhcsOXcbS3AonhQ32XVieLA091IRBqiUMZQ='; style-src 'self' https://fonts.googleapis.com https://translate.googleapis.com 'unsafe-inline'; img-src 'self' data: https://*.tawk.to https://translate.google.com https://translate.googleapis.com https://www.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cloud.umami.is https://*.tawk.to wss://*.tawk.to https://translate.googleapis.com https://formspree.io https://app.convertkit.com https://app.kit.com; frame-src https://*.tawk.to https://translate.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.convertkit.com https://app.kit.com https://formspree.io; object-src 'none'"

# Sveltia CMS (product editor, see DEVELOPMENT.md section 20) gets its own
# CSP here -- more specific paths win over "/*" on Netlify, so this
# replaces (not adds to) the baseline CSP above for anything under
# /admin/. See the adminCsp comment in this script for what's in it
# and the honest caveat about it not being verified against a live
# GitHub-backed CMS session yet.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; font-src 'self'; connect-src 'self' https://unpkg.com https://api.github.com https://*.githubusercontent.com; media-src blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
