# Clean URL for the safety page. This path is PRINTED ON THE PACKAGING
# (MoCRA adverse-event contact), so it must resolve forever. status=200 is
# a rewrite: /safety and /safety.html both serve safety.html.
[[redirects]]
  from = "/safety"
  to = "/safety.html"
  status = 200

# Long-lived caching for hashed/never-changing assets. Pages themselves
# (index.html, shop.html, etc.) intentionally aren't cached long here --
# Netlify already serves them with an ETag + must-revalidate by default,
# so browsers re-check on every visit and always get the latest deploy.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Scripts and styles: revalidate every time (Netlify answers 304 from its
  # ETag, so this costs a round trip and no bytes). The old seven-day
  # max-age let a returning shopper run stale cart/checkout code for a
  # week: the browser cache answered before the service worker could
  # even see the request (verify-D H-2).
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline security headers on every page -- identical policy to
# _headers and vercel.json (see this script's csp/otherHeaders).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cloud.umami.is https://embed.tawk.to https://cdn.jsdelivr.net/emojione/ https://translate.google.com https://translate.googleapis.com 'inline-speculation-rules' 'sha256-Wmlc/Lumj50wOdax6AEbaQv0zXK/9D0NZCQxPTdXDqM=' 'sha256-X8kUvpVWVbaRRvoM1l6EpaLEU/5DbGswOGSfQfOEV4g=' 'sha256-gUmq6gOoZ76O8R+C9JLLJzm46Aj4WygKv4n1nBxUfUk='; style-src 'self' https://embed.tawk.to https://translate.googleapis.com 'unsafe-inline'; img-src 'self' data: https://*.tawk.to https://cdn.jsdelivr.net/emojione/ https://translate.google.com https://translate.googleapis.com; font-src 'self' https://embed.tawk.to; connect-src 'self' https://cloud.umami.is https://*.tawk.to wss://*.tawk.to https://translate.googleapis.com https://translate-pa.googleapis.com https://formspree.io https://app.kit.com; frame-src https://*.tawk.to; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.kit.com https://formspree.io; object-src 'none'"

# Sveltia CMS (product editor, see DEVELOPMENT.md section 20) gets its own
# CSP here -- more specific paths win over "/*" on Netlify, so this
# replaces (not adds to) the baseline CSP above for anything under
# /admin/. See the adminCsp comment in this script for what's in it
# and the honest caveat about it not being verified against a live
# GitHub-backed CMS session yet.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https://*.githubusercontent.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' blob: data: https://unpkg.com https://cdn.jsdelivr.net https://api.github.com https://*.githubusercontent.com; media-src blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
