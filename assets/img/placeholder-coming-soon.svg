<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 933" width="700" height="933" role="img" aria-label="Small-batch botanical craft coming soon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110d"/>
      <stop offset="50%" stop-color="#1b1612"/>
      <stop offset="100%" stop-color="#110e0b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#8a5c30" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8a5c30" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8a5c30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep gothic background -->
  <rect width="700" height="933" fill="url(#bgGrad)"/>
  <circle cx="350" cy="390" r="280" fill="url(#glowGrad)"/>

  <!-- Apothecary double border with corner rosettes -->
  <rect x="22" y="22" width="656" height="889" rx="10" fill="none" stroke="#5a3d22" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="30" y="30" width="640" height="873" rx="8" fill="none" stroke="#332417" stroke-width="1"/>
  <circle cx="30" cy="30" r="4" fill="#8a5c30"/>
  <circle cx="670" cy="30" r="4" fill="#8a5c30"/>
  <circle cx="30" cy="903" r="4" fill="#8a5c30"/>
  <circle cx="670" cy="903" r="4" fill="#8a5c30"/>

  <!-- Botanical Herb & Flora Illustration (Lavender, Chamomile, Sweetgrass) -->
  <g id="botanical-bouquet" transform="translate(350, 365)">
    <!-- Aura halo circle -->
    <circle cx="0" cy="-40" r="105" fill="none" stroke="#8a5c30" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>

    <!-- Arching Sweetgrass Stems (Left & Right) -->
    <path d="M-6 75 C -35 25, -95 -10, -85 -95 C -75 -135, -45 -115, -48 -80 C -52 -45, -25 15, -2 75" fill="#4a5d3f" opacity="0.75"/>
    <path d="M6 75 C 35 25, 95 -10, 85 -95 C 75 -135, 45 -115, 48 -80 C 52 -45, 25 15, 2 75" fill="#4a5d3f" opacity="0.75"/>
    <path d="M-2 75 C -15 10, -50 -60, -32 -130 C -25 -100, -18 -40, 0 75" fill="#5c7052" opacity="0.8"/>
    <path d="M2 75 C 15 10, 50 -60, 32 -130 C 25 -100, 18 -40, 0 75" fill="#5c7052" opacity="0.8"/>

    <!-- Central Tall Lavender Spike -->
    <path d="M0 75 L 0 -135" stroke="#4a5d3f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lavender buds along stem -->
    <g fill="#9b8ea9">
      <ellipse cx="-7" cy="-75" rx="5" ry="3.5" transform="rotate(-25 -7 -75)"/>
      <ellipse cx="7" cy="-75" rx="5" ry="3.5" transform="rotate(25 7 -75)"/>
      <ellipse cx="-8" cy="-90" rx="5.5" ry="3.5" transform="rotate(-30 -8 -90)"/>
      <ellipse cx="8" cy="-90" rx="5.5" ry="3.5" transform="rotate(30 8 -90)"/>
      <ellipse cx="-7" cy="-105" rx="5" ry="3.5" transform="rotate(-25 -7 -105)"/>
      <ellipse cx="7" cy="-105" rx="5" ry="3.5" transform="rotate(25 7 -105)"/>
      <ellipse cx="-6" cy="-120" rx="4.5" ry="3" transform="rotate(-20 -6 -120)"/>
      <ellipse cx="6" cy="-120" rx="4.5" ry="3" transform="rotate(20 6 -120)"/>
      <ellipse cx="-4" cy="-132" rx="4" ry="2.5" transform="rotate(-15 -4 -132)"/>
      <ellipse cx="4" cy="-132" rx="4" ry="2.5" transform="rotate(15 4 -132)"/>
      <ellipse cx="0" cy="-142" rx="3.5" ry="5"/>
    </g>

    <!-- Left Angled Lavender Stem -->
    <path d="M-2 70 Q -25 0 -45 -65" stroke="#4a5d3f" stroke-width="2" stroke-linecap="round" fill="none"/>
    <g fill="#887899">
      <ellipse cx="-33" cy="-35" rx="4.5" ry="3" transform="rotate(-40 -33 -35)"/>
      <ellipse cx="-23" cy="-42" rx="4.5" ry="3" transform="rotate(10 -23 -42)"/>
      <ellipse cx="-41" cy="-50" rx="4.5" ry="3" transform="rotate(-45 -41 -50)"/>
      <ellipse cx="-32" cy="-56" rx="4.5" ry="3" transform="rotate(5 -32 -56)"/>
      <ellipse cx="-49" cy="-66" rx="4" ry="2.5" transform="rotate(-40 -49 -66)"/>
      <ellipse cx="-41" cy="-71" rx="4" ry="2.5" transform="rotate(10 -41 -71)"/>
      <ellipse cx="-49" cy="-78" rx="3.5" ry="4.5" transform="rotate(-20 -49 -78)"/>
    </g>

    <!-- Right Angled Lavender Stem -->
    <path d="M2 70 Q 25 0 45 -65" stroke="#4a5d3f" stroke-width="2" stroke-linecap="round" fill="none"/>
    <g fill="#887899">
      <ellipse cx="23" cy="-42" rx="4.5" ry="3" transform="rotate(-10 23 -42)"/>
      <ellipse cx="33" cy="-35" rx="4.5" ry="3" transform="rotate(40 33 -35)"/>
      <ellipse cx="32" cy="-56" rx="4.5" ry="3" transform="rotate(-5 32 -56)"/>
      <ellipse cx="41" cy="-50" rx="4.5" ry="3" transform="rotate(45 41 -50)"/>
      <ellipse cx="41" cy="-71" rx="4" ry="2.5" transform="rotate(-10 41 -71)"/>
      <ellipse cx="49" cy="-66" rx="4" ry="2.5" transform="rotate(40 49 -66)"/>
      <ellipse cx="49" cy="-78" rx="3.5" ry="4.5" transform="rotate(20 49 -78)"/>
    </g>

    <!-- Chamomile Flower - Center-Left -->
    <g transform="translate(-42, -5)">
      <!-- Petals -->
      <g fill="#f3ead9" opacity="0.95">
        <ellipse cx="0" cy="-21" rx="4.5" ry="11"/>
        <ellipse cx="15" cy="-15" rx="4.5" ry="11" transform="rotate(45 15 -15)"/>
        <ellipse cx="21" cy="0" rx="4.5" ry="11" transform="rotate(90 21 0)"/>
        <ellipse cx="15" cy="15" rx="4.5" ry="11" transform="rotate(135 15 15)"/>
        <ellipse cx="0" cy="21" rx="4.5" ry="11" transform="rotate(180 0 21)"/>
        <ellipse cx="-15" cy="15" rx="4.5" ry="11" transform="rotate(225 -15 15)"/>
        <ellipse cx="-21" cy="0" rx="4.5" ry="11" transform="rotate(270 -21 0)"/>
        <ellipse cx="-15" cy="-15" rx="4.5" ry="11" transform="rotate(315 -15 -15)"/>
      </g>
      <!-- Chamomile golden center disc -->
      <circle cx="0" cy="0" r="10" fill="#d69b5c"/>
      <circle cx="0" cy="0" r="7.5" fill="#e5aa6d"/>
      <circle cx="-2" cy="-2" r="3" fill="#f5c285" opacity="0.7"/>
    </g>

    <!-- Chamomile Flower - Center-Right (Slightly Smaller) -->
    <g transform="translate(46, 12) scale(0.82)">
      <g fill="#f3ead9" opacity="0.95">
        <ellipse cx="0" cy="-21" rx="4.5" ry="11"/>
        <ellipse cx="15" cy="-15" rx="4.5" ry="11" transform="rotate(45 15 -15)"/>
        <ellipse cx="21" cy="0" rx="4.5" ry="11" transform="rotate(90 21 0)"/>
        <ellipse cx="15" cy="15" rx="4.5" ry="11" transform="rotate(135 15 15)"/>
        <ellipse cx="0" cy="21" rx="4.5" ry="11" transform="rotate(180 0 21)"/>
        <ellipse cx="-15" cy="15" rx="4.5" ry="11" transform="rotate(225 -15 15)"/>
        <ellipse cx="-21" cy="0" rx="4.5" ry="11" transform="rotate(270 -21 0)"/>
        <ellipse cx="-15" cy="-15" rx="4.5" ry="11" transform="rotate(315 -15 -15)"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#d69b5c"/>
      <circle cx="0" cy="0" r="7.5" fill="#e5aa6d"/>
      <circle cx="-2" cy="-2" r="3" fill="#f5c285" opacity="0.7"/>
    </g>

    <!-- Little chamomile bud -->
    <g transform="translate(18, -48) scale(0.55)">
      <g fill="#f3ead9" opacity="0.9">
        <ellipse cx="0" cy="-16" rx="4" ry="9"/>
        <ellipse cx="12" cy="-11" rx="4" ry="9" transform="rotate(45 12 -11)"/>
        <ellipse cx="16" cy="0" rx="4" ry="9" transform="rotate(90 16 0)"/>
        <ellipse cx="0" cy="16" rx="4" ry="9" transform="rotate(180 0 16)"/>
        <ellipse cx="-16" cy="0" rx="4" ry="9" transform="rotate(270 -16 0)"/>
      </g>
      <circle cx="0" cy="0" r="8" fill="#d69b5c"/>
    </g>

    <!-- Apothecary Twine Ribbon Bow Tie -->
    <path d="M-18 68 C -8 63, -4 74, 0 74 C 4 74, 8 63, 18 68 C 10 74, 6 82, 0 77 C -6 82, -10 74, -18 68 Z" fill="#c4823f"/>
    <circle cx="0" cy="73" r="3.5" fill="#d69b5c"/>
    <path d="M-3 76 Q -12 96 -18 108" stroke="#c4823f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M3 76 Q 10 94 15 106" stroke="#c4823f" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Subtle Celestial Sparks / Herbal Magic -->
    <g fill="#d69b5c" opacity="0.85">
      <!-- Spark left -->
      <path d="M -90 -40 Q -85 -40 -85 -45 Q -85 -40 -80 -40 Q -85 -40 -85 -35 Q -85 -40 -90 -40 Z"/>
      <!-- Spark right -->
      <path d="M 85 -55 Q 90 -55 90 -60 Q 90 -55 95 -55 Q 90 -55 90 -50 Q 90 -55 85 -55 Z"/>
      <!-- Spark top -->
      <path d="M -15 -165 Q -10 -165 -10 -170 Q -10 -165 -5 -165 Q -10 -165 -10 -160 Q -10 -165 -15 -165 Z"/>
      <circle cx="95" cy="-20" r="2"/>
      <circle cx="-80" cy="-85" r="1.5"/>
      <circle cx="25" cy="-148" r="1.5"/>
    </g>
  </g>

  <!-- Typography & Information Hierarchy -->
  <text x="350" y="525" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#c4823f">SMALL-BATCH APOTHECARY</text>
  <text x="350" y="565" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#f3ead9">New Batch in the Works</text>
  <text x="350" y="605" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="1.2" fill="#cfc0a8">Handcrafted in the Blue Ridge Foothills</text>
  <text x="350" y="645" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" letter-spacing="1" fill="#d69b5c">Y&#8217;allternative Living</text>
</svg>
