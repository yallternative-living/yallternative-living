# Cloudflare Worker config for the checkout backend.
#
# This is the REAL config (wrangler.toml.example is the annotated template it
# was copied from). It's committed on purpose: Workers Builds -- Cloudflare's
# git integration -- reads this file straight out of the repo and redeploys
# checkout.js on every push to main, so nobody has to run `wrangler deploy`
# by hand. See workers/README.md "Option A".
#
# Nothing secret lives here, and nothing secret ever should. STRIPE_SECRET_KEY
# is set as a Secret in the Cloudflare dashboard (Settings -> Variables and
# Secrets), never in this file -- it would be committed to a public repo.
#
# Dashboard setup this file does NOT cover (one-time, by hand):
#   1. Workers & Pages -> Create -> Import a repository -> this repo,
#      with the project root set to `workers`.
#   2. Settings -> Variables and Secrets -> add STRIPE_SECRET_KEY as a Secret.
#      Use a RESTRICTED Stripe key with Checkout Sessions, Coupons, Promotion
#      Codes and Customers WRITE, plus Tax Settings READ. Miss the Tax read and
#      sales tax silently never switches on -- nothing errors, it just
#      undercharges.
#   3. Settings -> Domains & Routes -> Add -> Route ->
#      yallternativeliving.com/api/checkout
#      That path is not arbitrary: assets/js/cart.js posts to "/api/checkout"
#      (see its CHECKOUT_URL constant). Change one, change the other.

name = "yallternative-checkout"
main = "checkout.js"
compatibility_date = "2026-01-01"

# Both of these default to ON and wrangler warns about relying on that. Set
# explicitly so the intent is readable and a Cloudflare default flip can't
# silently change what's exposed.
#
# workers_dev: KEEP ON. The site reaches this Worker through a Netlify proxy
# (netlify.toml's /api/checkout rule, generated by
# scripts/build-security-headers.js) that forwards to the workers.dev
# hostname. Turning this off takes checkout offline.
workers_dev = true

# preview_urls: OFF. Every non-production branch build runs
# `wrangler versions upload`, and each uploaded version would otherwise get
# its own public URL -- extra internet-facing copies of the checkout endpoint,
# each with the production Stripe secret bound, for no benefit. Production
# traffic only ever goes through the proxy above.
preview_urls = false

[vars]
# Used by the Worker's CORS check. checkout.js also hard-codes the apex and www
# hosts in its ALLOWED_ORIGINS, so this is belt-and-braces for that same origin
# rather than the only thing standing between the cart and a wildcard CORS
# policy.
SITE_ORIGIN = "https://yallternativeliving.com"

# Sales tax needs no config here: the Worker asks Stripe hourly and turns
# automatic_tax on by itself once Tax -> Settings/Registrations are filled in
# on the Stripe Dashboard. This var is only an override -- "true" forces it on
# without checking, "false" is a kill switch. Left unset on purpose.
# STRIPE_TAX_ENABLED = "false"

# ===========================================================================
# STATE LAYER (phase A: workers/state/*, workers/schema.sql)
#
# ---------------------------------------------------------------------------
# THESE FOUR BLOCKS ARE COMMENTED OUT ON PURPOSE. DO NOT UNCOMMENT ALONE.
# ---------------------------------------------------------------------------
# Workers Builds redeploys this Worker from this file on every push to main.
# A live `[[durable_objects.bindings]]` whose class the entrypoint does not
# export, or a `[[d1_databases]]` with the placeholder id below, fails
# `wrangler deploy` outright -- which would mean the next urgent checkout fix
# silently never ships. So the config is written out, reviewed and ready, but
# inert until the code it points at exists.
#
# Uncomment ALL of it in ONE phase-B commit that also:
#   1. exports the Durable Object classes from the entrypoint (checkout.js):
#        export { GiftCardLedger } from "./state/gift-card-ledger.js";
#        export { RateLimitCounter } from "./state/rate-limit.js";
#      A DO binding is only valid if its class_name is exported by `main`.
#   2. replaces database_id below with the real id printed by:
#        npx wrangler d1 create yallternative-state
#      then loads the schema once:
#        npx wrangler d1 execute yallternative-state --remote --file=workers/schema.sql
#   3. adds the MAGIC_LINK_SECRET secret (Settings -> Variables and Secrets, or
#      `npx wrangler secret put MAGIC_LINK_SECRET`). Never a [vars] entry.
#
# See docs/STATE-LAYER.md for the full dashboard runbook and workers/state/README.md
# for the module-by-module contract.
# ===========================================================================

# Gift-card balances: one Durable Object per code, addressed with
# idFromName(normalizeCode(code)). Strongly consistent and serialised, which is
# what makes the reserve/commit/release cycle safe against two tabs at once.
# [[durable_objects.bindings]]
# name = "GIFT_CARD_LEDGER"
# class_name = "GiftCardLedger"

# Exact fixed-window rate limiting, one object per key. Only for endpoints where
# the permissive per-location Rate Limiting binding is not good enough; each
# check costs one DO request against the free plan's 100k/day.
# [[durable_objects.bindings]]
# name = "RATE_LIMIT_COUNTER"
# class_name = "RateLimitCounter"

# new_sqlite_classes -- NOT new_classes. SQLite-backed Durable Objects are the
# ones included on the Workers Free plan; the older key-value DO backend is
# paid-only. Getting this wrong is a hard deploy failure, and a class's storage
# backend cannot be changed after the migration is applied.
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["GiftCardLedger", "RateLimitCounter"]

# Webhook event claims, the loyalty points ledger and burned magic-link tokens.
# Create it once, per environment:
#   npx wrangler d1 create yallternative-state
# and paste the printed database_id over the placeholder below.
# [[d1_databases]]
# binding = "STATE_DB"
# database_name = "yallternative-state"
# database_id = "REPLACE_ME_WITH_THE_ID_FROM_WRANGLER_D1_CREATE"

# Optional: Cloudflare's built-in Rate Limiting binding. Free, storage-free and
# preferred for high-volume public reads (gift-card balance, order status), but
# enforced PER LOCATION and best-effort, so it shapes abuse rather than bounding
# it. `simple.period` accepts only 10 or 60. workers/state/rate-limit.js uses
# this automatically when env.RATE_LIMITER exists and falls back to the exact
# Durable Object counter when it does not -- so leaving this commented out is a
# valid, working configuration.
# VERIFY IN THE DASHBOARD FIRST: confirm the Rate Limiting binding is offered on
# the Free plan for this account before relying on it (docs move; the fallback
# does not).
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
