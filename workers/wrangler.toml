# Cloudflare Worker config for the checkout backend.
#
# This is the REAL config (wrangler.toml.example is the annotated template it
# was copied from). It's committed on purpose: Workers Builds -- Cloudflare's
# git integration -- reads this file straight out of the repo and redeploys
# checkout.js on every push to main, so nobody has to run `wrangler deploy`
# by hand. See workers/README.md "Option A".
#
# Nothing secret lives here, and nothing secret ever should. STRIPE_SECRET_KEY
# is set as a Secret in the Cloudflare dashboard (Settings -> Variables and
# Secrets), never in this file -- it would be committed to a public repo.
#
# Dashboard setup this file does NOT cover (one-time, by hand):
#   1. Workers & Pages -> Create -> Import a repository -> this repo,
#      with the project root set to `workers`.
#   2. Settings -> Variables and Secrets -> add STRIPE_SECRET_KEY as a Secret.
#      Use a RESTRICTED Stripe key with Checkout Sessions, Coupons, Promotion
#      Codes and Customers WRITE, plus Tax Settings READ. Miss the Tax read and
#      sales tax silently never switches on -- nothing errors, it just
#      undercharges.
#   3. Settings -> Domains & Routes. Optional, and only if this Worker is ever
#      served from the apex domain directly: a route for
#      yallternativeliving.com/api/*. Today the site reaches the Worker through
#      Netlify's /api/* proxy instead (see workers/README.md), so no route is
#      required. That path is not arbitrary: assets/js/cart.js posts to
#      "/api/checkout" (see its CHECKOUT_URL constant) and the other pages post
#      to their own /api/... paths. Change one, change the other.

name = "yallternative-checkout"
main = "checkout.js"
compatibility_date = "2026-01-01"

# Both of these default to ON and wrangler warns about relying on that. Set
# explicitly so the intent is readable and a Cloudflare default flip can't
# silently change what's exposed.
#
# workers_dev: KEEP ON. The site reaches this Worker through a Netlify proxy
# (netlify.toml's /api/* rule, generated by
# scripts/build-security-headers.js) that forwards to the workers.dev
# hostname. Turning this off takes checkout -- and every other /api route --
# offline.
workers_dev = true

# preview_urls: OFF. Every non-production branch build runs
# `wrangler versions upload`, and each uploaded version would otherwise get
# its own public URL -- extra internet-facing copies of the checkout endpoint,
# each with the production Stripe secret bound, for no benefit. Production
# traffic only ever goes through the proxy above.
preview_urls = false

[vars]
# Used by the Worker's CORS check. checkout.js also hard-codes the apex and www
# hosts in its ALLOWED_ORIGINS, so this is belt-and-braces for that same origin
# rather than the only thing standing between the cart and a wildcard CORS
# policy.
SITE_ORIGIN = "https://yallternativeliving.com"

# Sales tax needs no config here: the Worker asks Stripe hourly and turns
# automatic_tax on by itself once Tax -> Settings/Registrations are filled in
# on the Stripe Dashboard. This var is only an override -- "true" forces it on
# without checking, "false" is a kill switch. Left unset on purpose.
# STRIPE_TAX_ENABLED = "false"

# --- Retention layer -------------------------------------------------------
# Points a customer earns per whole dollar comes from the CMS
# (content.json site.loyaltyPointsPerDollar), not from here -- the badge on the
# product card and the points actually credited have to be the same number.
#
# These two decide what a payout is worth. 100 points = $5 at 1 point/$1, i.e.
# a 5% effective return once a customer has spent $100.
LOYALTY_REDEEM_THRESHOLD = "100"
LOYALTY_REWARD_CENTS = "500"

# The shared Stripe COUPONS the single-use Promotion Codes are minted against.
# Create them once in the Stripe Dashboard (Products -> Coupons) and paste the
# ids here; they are ids, not secrets, and one coupon backs unlimited codes:
#
#   * a 10% off coupon              -> STRIPE_WELCOME_COUPON_ID
#   * a $5.00 off (USD) coupon      -> STRIPE_BIRTHDAY_COUPON_ID
#                                      (STRIPE_LOYALTY_COUPON_ID falls back to
#                                       it, so one $5 coupon can serve both)
#
# LEFT UNSET ON PURPOSE until those coupons exist. Unset is a defined state:
# /api/welcome-code answers `{"configured": false}` and welcome.html shows the
# CMS welcomeCode instead, and the birthday/loyalty jobs log and do nothing
# rather than minting codes against a coupon id that is not there.
# STRIPE_WELCOME_COUPON_ID = "promo_coupon_id_here"
# STRIPE_BIRTHDAY_COUPON_ID = "promo_coupon_id_here"
# STRIPE_LOYALTY_COUPON_ID = "promo_coupon_id_here"

# Optional: a verified Resend sender used for the retention sends only. Falls
# back to GIFT_CARD_FROM_EMAIL.
# RETENTION_FROM_EMAIL = "Y'allternative Living <hello@yallternativeliving.com>"

# ===========================================================================
# CRON
#
# One hourly trigger runs every scheduled job in checkout.js's `scheduled`
# handler: the webhook-claim and burned-token sweeps, the email-queue sweep,
# the birthday club and the email-queue drain.
#
# HOURLY, NOT DAILY, and that is deliberate:
#   - the abandoned-checkout recovery mail wants to go out within the hour;
#   - a daily trigger that fails has to wait 24h for its next chance, while an
#     hourly one retries by itself;
#   - the birthday job is idempotent per member per year AND gated to 9am
#     America/New_York, so 24 ticks a day still send exactly one birthday code.
# Cron triggers are free on the Workers Free plan and each tick is one indexed
# D1 query when there is nothing to do.
#
# :07 rather than :00 to stay off the crowded top of the hour.
# ===========================================================================
[triggers]
crons = ["7 * * * *"]

# ===========================================================================
# STATE LAYER (workers/state/*, workers/schema.sql)
#
# ---------------------------------------------------------------------------
# LIVE AS OF PHASE B. The D1 id below is the real one (created 2026-09-02).
# ---------------------------------------------------------------------------
# Workers Builds redeploys this Worker from this file on every push to main. A
# [[d1_databases]] block whose id does not exist fails `wrangler deploy`
# outright, which would mean the next urgent checkout fix silently never
# ships -- so if the database is ever recreated, update the id here in the
# same commit:
#
#   npx wrangler d1 create yallternative-state      # prints the database_id
#   npx wrangler d1 execute yallternative-state --remote --file=workers/schema.sql
#
# (The schema is also applied automatically at the first webhook request by
# workers/state/migrations.js, so step two is belt and braces.)
#
# The Durable Object bindings below are already valid: checkout.js -- this
# Worker's `main` -- exports GiftCardLedger and RateLimitCounter at the foot of
# the file, which is what a `class_name` has to point at.
#
# Secrets, set in the dashboard or with `npx wrangler secret put NAME`, never as
# [vars] entries: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY,
# MAGIC_LINK_SECRET. That last one signs the unsubscribe and points links; with
# it unset the Worker sends NO marketing email at all, which is the intended
# behaviour rather than a bug -- an email with no working opt-out link is worse
# than an unsent one.
#
# See workers/README.md for the full deploy checklist and docs/STATE-LAYER.md
# for the architecture.
# ===========================================================================

# Gift-card balances: one Durable Object per code, addressed with
# idFromName(normalizeCode(code)). Strongly consistent and serialised, which is
# what makes the reserve/commit/release cycle safe against two tabs at once.
[[durable_objects.bindings]]
name = "GIFT_CARD_LEDGER"
class_name = "GiftCardLedger"

# Exact fixed-window rate limiting, one object per key. Used by
# /api/gift-card-balance, /api/order-status and /api/restock; each check costs
# one DO request against the free plan's 100k/day.
[[durable_objects.bindings]]
name = "RATE_LIMIT_COUNTER"
class_name = "RateLimitCounter"

# new_sqlite_classes -- NOT new_classes. SQLite-backed Durable Objects are the
# ones included on the Workers Free plan; the older key-value DO backend is
# paid-only. Getting this wrong is a hard deploy failure, and a class's storage
# backend cannot be changed after the migration is applied.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GiftCardLedger", "RateLimitCounter"]

# Webhook event claims (exactly-once processing), the loyalty points ledger and
# burned magic-link tokens. Created once per environment with
#   npx wrangler d1 create yallternative-state
# (this one: 2026-09-02, region WNAM). workers/schema.sql is applied lazily by
# workers/state/migrations.js at the first webhook request, or up front with
# the `d1 execute` command in the header above.
#
# The Worker degrades rather than crashes if this binding is missing at
# runtime: checkout keeps working, the webhook processes events without the
# exactly-once claim table (every effect is idempotent on its own, see
# workers/routes/stripe-webhook.js) and the order-status/balance routes do
# not use it at all. What it must NOT be is present with a stale id -- that
# fails the deploy, see the header.
[[d1_databases]]
binding = "STATE_DB"
database_name = "yallternative-state"
database_id = "7039063c-e2dd-41c3-bcb6-f17ac785e972"

# Optional: Cloudflare's built-in Rate Limiting binding. Free, storage-free and
# preferred for high-volume public reads (gift-card balance, order status), but
# enforced PER LOCATION and best-effort, so it shapes abuse rather than bounding
# it. `simple.period` accepts only 10 or 60. workers/state/rate-limit.js uses
# this automatically when env.RATE_LIMITER exists and falls back to the exact
# RATE_LIMIT_COUNTER Durable Object above when it does not -- so leaving this
# commented out is a valid, working configuration, and it is the one that ships.
#
# TO ENABLE: verify in the dashboard FIRST that the Rate Limiting binding is
# offered on the Free plan for this account (Cloudflare -> the Worker ->
# Settings -> Bindings -> Add -> Rate limiting). Docs move; the DO fallback does
# not. Then uncomment all four lines below and redeploy. Nothing in the code
# changes -- checkRateLimit picks the binding up on its own -- but the per-check
# Durable Object cost disappears and the limit becomes per-location instead of
# global. Note that the per-call `limit`/`period` in the route handlers are
# IGNORED on this path: the numbers below are what apply.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
